name: Run fallback trace
on:
  workflow_dispatch:
  push:
    branches: [client-zh-fixed-reconstruction]
    paths: ['tools/client-source/trace-appguard-fallback-callback.py','.github/workflows/run-fallback-trace.yml']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python -m pip install unicorn capstone pyelftools
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/x work/n
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o work/a.xapk 'https://d.apkpure.net/b/XAPK/com.bandainamcoent.imas_millionlive_theaterdays_ch?version=latest'
          test "$(sha1sum work/a.xapk|awk '{print $1}')" = 1b77ddd342a4020ba032ec63ae7ef9288551b6e7
          unzip -q work/a.xapk -d work/x
          unzip -q work/x/config.arm64_v8a.apk 'lib/arm64-v8a/libcompatible.so' -d work/n
          test "$(sha256sum work/n/lib/arm64-v8a/libcompatible.so|awk '{print $1}')" = 8880c415e1ab82c31858be68ce12b76b95dc8ff8875b76c1246a8bc0679647bc
          OUT=client/reconstruction/appguard-analysis/callback-installer/fallback-callback
          rm -rf "$OUT"
          python tools/client-source/trace-appguard-fallback-callback.py --libcompatible work/n/lib/arm64-v8a/libcompatible.so --out "$OUT"
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/reconstruction/appguard-analysis/callback-installer/fallback-callback
          git diff --cached --quiet && exit 0
          git commit -m 'client: record fallback callback trace'
          git fetch origin client-zh-fixed-reconstruction
          git rebase origin/client-zh-fixed-reconstruction
          git push origin HEAD:client-zh-fixed-reconstruction
