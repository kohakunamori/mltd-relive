name: Analyze AppGuard direct syscalls

on:
  workflow_dispatch:
  push:
    branches:
      - client-zh-fixed-reconstruction
    paths:
      - '.github/workflows/analyze-appguard-syscalls.yml'
      - 'tools/client-source/analyze-appguard-syscalls.py'
      - 'tools/client-source/analyze-appguard-direct-calls.py'
      - 'tools/client-source/analyze-appguard-bootstrap.py'
      - 'tools/client-source/analyze-appguard-loader-slice.py'
      - 'tools/client-source/analyze-appguard-mprotect.py'
      - 'tools/client-source/summarize-appguard-init.py'
      - 'tools/client-source/analyze-appguard-solibrary.py'
      - 'tools/client-source/analyze-appguard-dispatch.py'
      - 'tools/client-source/analyze-appguard-asmfunction.py'
      - 'tools/client-source/analyze-appguard-asmfunction-flow.py'
      - 'tools/client-source/extract-appguard-static-config.py'

permissions:
  contents: write

jobs:
  syscall-map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install analysis libraries
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check capstone pyelftools

      - name: Download exact official arm64 split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk work/native
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 300 \
            -A 'Mozilla/5.0' \
            -o work/original.xapk \
            'https://d.apkpure.net/b/XAPK/com.bandainamcoent.imas_millionlive_theaterdays_ch?version=latest'
          test "$(sha1sum work/original.xapk | awk '{print $1}')" = '1b77ddd342a4020ba032ec63ae7ef9288551b6e7'
          unzip -q work/original.xapk -d work/xapk
          test "$(sha256sum work/xapk/config.arm64_v8a.apk | awk '{print $1}')" = '9932366bd357dc33701a6e7282d26ed67630db95486f596328aade8523032e46'
          unzip -q work/xapk/config.arm64_v8a.apk 'lib/arm64-v8a/*.so' -d work/split
          cp work/split/lib/arm64-v8a/*.so work/native/

      - name: Recover AppGuard bootstrap, dispatch and static config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-syscalls.py \
            --native-dir work/native \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-direct-calls.py \
            --native-dir work/native \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-bootstrap.py \
            --libcompatible work/native/libcompatible.so \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-loader-slice.py \
            --libcompatible work/native/libcompatible.so \
            --bootstrap-json client/reconstruction/appguard-analysis/bootstrap-cfg.json \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-mprotect.py \
            --bootstrap client/reconstruction/appguard-analysis/bootstrap-cfg.json \
            --loader-slice client/reconstruction/appguard-analysis/loader-slice.json \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/summarize-appguard-init.py \
            --bootstrap client/reconstruction/appguard-analysis/bootstrap-cfg.json \
            --loader-slice client/reconstruction/appguard-analysis/loader-slice.json \
            --out client/reconstruction/appguard-analysis \
            --end 0x7d80
          python tools/client-source/analyze-appguard-solibrary.py \
            --libcompatible work/native/libcompatible.so \
            --loader-slice client/reconstruction/appguard-analysis/loader-slice.json \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-dispatch.py \
            --libcompatible work/native/libcompatible.so \
            --solibrary-cfg client/reconstruction/appguard-analysis/solibrary-cfg.json \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-asmfunction.py \
            --libcompatible work/native/libcompatible.so \
            --bootstrap client/reconstruction/appguard-analysis/bootstrap-cfg.json \
            --dispatch client/reconstruction/appguard-analysis/dispatch-table.json \
            --loader-slice client/reconstruction/appguard-analysis/loader-slice.json \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-asmfunction-flow.py \
            --libcompatible work/native/libcompatible.so \
            --bootstrap client/reconstruction/appguard-analysis/bootstrap-cfg.json \
            --asm-init client/reconstruction/appguard-analysis/asmfunction-init.json \
            --loader-slice client/reconstruction/appguard-analysis/loader-slice.json \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/extract-appguard-static-config.py \
            --libcompatible work/native/libcompatible.so \
            --out client/reconstruction/appguard-analysis

      - name: Commit maps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/reconstruction/appguard-analysis/syscall-map.json \
                  client/reconstruction/appguard-analysis/syscall-map.md \
                  client/reconstruction/appguard-analysis/direct-call-map.json \
                  client/reconstruction/appguard-analysis/direct-call-map.md \
                  client/reconstruction/appguard-analysis/bootstrap-cfg.json \
                  client/reconstruction/appguard-analysis/bootstrap-cfg.md \
                  client/reconstruction/appguard-analysis/loader-slice.json \
                  client/reconstruction/appguard-analysis/loader-slice.md \
                  client/reconstruction/appguard-analysis/mprotect-slice.json \
                  client/reconstruction/appguard-analysis/mprotect-slice.md \
                  client/reconstruction/appguard-analysis/dt-init-region.md \
                  client/reconstruction/appguard-analysis/solibrary-cfg.json \
                  client/reconstruction/appguard-analysis/solibrary-cfg.md \
                  client/reconstruction/appguard-analysis/dispatch-table.json \
                  client/reconstruction/appguard-analysis/dispatch-table.md \
                  client/reconstruction/appguard-analysis/asmfunction-init.json \
                  client/reconstruction/appguard-analysis/asmfunction-init.md \
                  client/reconstruction/appguard-analysis/asmfunction-flow.json \
                  client/reconstruction/appguard-analysis/asmfunction-flow.md \
                  client/reconstruction/appguard-analysis/static-config.json \
                  client/reconstruction/appguard-analysis/static-config.md
          if test -f client/reconstruction/appguard-analysis/static-config-0x1070.bin; then
            git add client/reconstruction/appguard-analysis/static-config-0x1070.bin
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'client: extend DT_INIT through config transform'
          git push origin HEAD:client-zh-fixed-reconstruction
