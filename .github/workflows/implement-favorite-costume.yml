name: Implement favorite costume persistence

on:
  push:
    branches: [fix/story-service-compat]
    paths: ['.github/workflows/implement-favorite-costume.yml']

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-service-compat
          fetch-depth: 0
      - name: Patch implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          # Model: ordered association keyed by stable per-user Idol.idol_id.
          replace('standalone/mltd/models/models.py',
          "    mst_costumes: Mapped[List['MstCostume']] = relationship(\n        secondary='costume',\n        primaryjoin='and_(Idol.user_id == Costume.user_id, '\n            + 'Idol.mst_idol_id == MstCostume.mst_idol_id)',\n        viewonly=True, lazy='selectin')\n",
          "    mst_costumes: Mapped[List['MstCostume']] = relationship(\n        secondary='costume',\n        primaryjoin='and_(Idol.user_id == Costume.user_id, '\n            + 'Idol.mst_idol_id == MstCostume.mst_idol_id)',\n        viewonly=True, lazy='selectin')\n    favorite_mst_costumes: Mapped[List['MstCostume']] = relationship(\n        secondary='favorite_costume',\n        primaryjoin='Idol.idol_id == FavoriteCostume.idol_id',\n        secondaryjoin=(\n            'FavoriteCostume.mst_costume_id == MstCostume.mst_costume_id'),\n        order_by='FavoriteCostume.sort_order',\n        viewonly=True, lazy='selectin')\n")

          replace('standalone/mltd/models/models.py',
          "class MstCostumeBulkChangeGroup(Base):\n",
          "class FavoriteCostume(Base):\n    \"\"\"Ordered favorite-costume selection for one user idol.\"\"\"\n    __tablename__ = 'favorite_costume'\n    __table_args__ = (\n        db.PrimaryKeyConstraint(\n            'idol_id', 'mst_costume_id', name='favorite_costume_pk'),\n        db.UniqueConstraint(\n            'idol_id', 'sort_order', name='favorite_costume_order_un'),\n    )\n\n    idol_id = mapped_column(ForeignKey('idol.idol_id'), nullable=False)\n    mst_costume_id = mapped_column(\n        ForeignKey('mst_costume.mst_costume_id'), nullable=False)\n    sort_order: Mapped[int]\n\n\nclass MstCostumeBulkChangeGroup(Base):\n")

          # Schema: IdolStatus.favorite_costume_list is CostumeStatus[].
          replace('standalone/mltd/models/schemas.py',
          "    mst_costumes = Nested('MstCostumeSchema', many=True)\n    mst_voice_categories = Nested('MstVoiceCategorySchema', many=True)\n",
          "    mst_costumes = Nested('MstCostumeSchema', many=True)\n    favorite_mst_costumes = Nested('MstCostumeSchema', many=True)\n    mst_voice_categories = Nested('MstVoiceCategorySchema', many=True)\n")
          replace('standalone/mltd/models/schemas.py',
          "        data['favorite_costume_list'] = None\n",
          "        data['favorite_costume_list'] = data['favorite_mst_costumes']\n        del data['favorite_mst_costumes']\n")

          # Existing databases need the additive table too; fresh DBs get it via create_all.
          replace('standalone/mltd/models/setup.py',
          "    if version_tuple(db_version) == version_tuple('0.1.7'):\n        logger.info('Validating v0.1.7 migration data...')\n        with Session(engine) as session:\n            _migrate_theater_contact_and_user_contact_schedules(session)\n            session.commit()\n        logger.info('v0.1.7 migration data validated.')\n",
          "    if version_tuple(db_version) == version_tuple('0.1.7'):\n        logger.info('Validating v0.1.7 migration data...')\n        with Session(engine) as session:\n            _migrate_theater_contact_and_user_contact_schedules(session)\n            session.commit()\n        logger.info('v0.1.7 migration data validated.')\n\n    # Additive compatibility state introduced after the historical schema\n    # version stopped advancing. This is safe and idempotent for old saves.\n    with Session(engine) as session:\n        Base.metadata.tables['favorite_costume'].create(\n            bind=session.get_bind(), checkfirst=True)\n        session.commit()\n")

          # RPC implementation.
          replace('standalone/mltd/services/idol.py',
          "from sqlalchemy import select\n",
          "from sqlalchemy import delete, select\n")
          replace('standalone/mltd/services/idol.py',
          "from mltd.models.models import (CostumeAdv, Episode, Idol, Memorial,\n                                MstCostumeBulkChangeGroup)\n",
          "from mltd.models.models import (Costume, CostumeAdv, Episode,\n                                FavoriteCostume, Idol, Memorial, MstCostume,\n                                MstCostumeBulkChangeGroup)\n")
          replace('standalone/mltd/services/idol.py',
          "from mltd.models.schemas import (CostumeAdvSchema, EpisodeSchema, IdolSchema,\n                                 MemorialSchema,\n                                 MstCostumeBulkChangeGroupSchema)\n",
          "from mltd.models.schemas import (CostumeAdvSchema, EpisodeSchema, IdolSchema,\n                                 MemorialSchema, MstCostumeSchema,\n                                 MstCostumeBulkChangeGroupSchema)\n")
          insert = '''\n\n@dispatcher.add_method(name='IdolService.SetFavoriteCostume', context_arg='context')\ndef set_favorite_costume(params, context):\n    \"\"\"Replace an idol's ordered favorite-costume selection atomically.\"\"\"\n    user_id = UUID(context['user_id'])\n    mst_idol_id = int(params['mst_idol_id'])\n    costume_ids = [int(value) for value in params.get('mst_costume_id_list', [])]\n\n    if len(costume_ids) != len(set(costume_ids)):\n        raise ValueError('mst_costume_id_list contains duplicates')\n\n    with Session(engine) as session:\n        idol = session.scalar(\n            select(Idol)\n            .where(Idol.user_id == user_id)\n            .where(Idol.mst_idol_id == mst_idol_id)\n        )\n        if idol is None:\n            raise ValueError('idol is not owned by user')\n\n        costume_by_id = {}\n        if costume_ids:\n            owned = session.scalars(\n                select(MstCostume)\n                .join(Costume, Costume.mst_costume_id == MstCostume.mst_costume_id)\n                .where(Costume.user_id == user_id)\n                .where(MstCostume.mst_idol_id == mst_idol_id)\n                .where(MstCostume.mst_costume_id.in_(costume_ids))\n            ).all()\n            costume_by_id = {row.mst_costume_id: row for row in owned}\n            if set(costume_by_id) != set(costume_ids):\n                raise ValueError('favorite costume is not owned by target idol')\n\n        # Validate the entire request before deleting prior state so a bad\n        # request cannot partially clear favorites. The transaction commits\n        # only after every replacement row has been staged.\n        session.execute(\n            delete(FavoriteCostume)\n            .where(FavoriteCostume.idol_id == idol.idol_id)\n        )\n        for sort_order, mst_costume_id in enumerate(costume_ids):\n            session.add(FavoriteCostume(\n                idol_id=idol.idol_id,\n                mst_costume_id=mst_costume_id,\n                sort_order=sort_order,\n            ))\n        session.commit()\n\n        favorites = [costume_by_id[value] for value in costume_ids]\n        return {\n            'favorite_costume_list': MstCostumeSchema().dump(\n                favorites, many=True),\n        }\n'''
          p=Path('standalone/mltd/services/idol.py')
          p.write_text(p.read_text()+insert)

          # Runtime test: persistence, replay, clear, validation atomicity, IdolStatus shape.
          Path('tests/test_favorite_costume_runtime.py').write_text(r'''\n\"\"\"Runtime coverage for IdolService.SetFavoriteCostume persistence.\"\"\"\nimport unittest\n\nfrom sqlalchemy import delete, select\nfrom sqlalchemy.orm import Session\n\nfrom mltd.models.engine import engine\nfrom mltd.models.models import Costume, FavoriteCostume, Idol, MstCostume\nfrom mltd.models.schemas import IdolSchema\nfrom mltd.services.idol import set_favorite_costume\n\n\nclass FavoriteCostumeRuntimeTest(unittest.TestCase):\n    @classmethod\n    def setUpClass(cls):\n        with Session(engine) as session:\n            candidates = session.execute(\n                select(Costume.user_id, MstCostume.mst_idol_id)\n                .join(MstCostume, Costume.mst_costume_id == MstCostume.mst_costume_id)\n                .group_by(Costume.user_id, MstCostume.mst_idol_id)\n                .having(__import__('sqlalchemy').func.count() >= 2)\n                .limit(1)\n            ).first()\n            if candidates is None:\n                raise AssertionError('standalone setup has no idol with two costumes')\n            cls.user_id, cls.mst_idol_id = candidates\n            cls.idol = session.scalar(\n                select(Idol)\n                .where(Idol.user_id == cls.user_id)\n                .where(Idol.mst_idol_id == cls.mst_idol_id)\n            )\n            cls.costume_ids = list(session.scalars(\n                select(MstCostume.mst_costume_id)\n                .join(Costume, Costume.mst_costume_id == MstCostume.mst_costume_id)\n                .where(Costume.user_id == cls.user_id)\n                .where(MstCostume.mst_idol_id == cls.mst_idol_id)\n                .order_by(MstCostume.mst_costume_id)\n                .limit(2)\n            ))\n        cls.context = {'user_id': str(cls.user_id)}\n\n    def setUp(self):\n        with Session(engine) as session:\n            session.execute(delete(FavoriteCostume).where(\n                FavoriteCostume.idol_id == self.idol.idol_id))\n            session.commit()\n\n    def _stored_ids(self):\n        with Session(engine) as session:\n            return list(session.scalars(\n                select(FavoriteCostume.mst_costume_id)\n                .where(FavoriteCostume.idol_id == self.idol.idol_id)\n                .order_by(FavoriteCostume.sort_order)\n            ))\n\n    def test_replace_replay_persist_and_clear(self):\n        params = {\n            'mst_idol_id': self.mst_idol_id,\n            'mst_costume_id_list': list(reversed(self.costume_ids)),\n        }\n        first = set_favorite_costume(params, self.context)\n        second = set_favorite_costume(params, self.context)\n        self.assertEqual(\n            [v['mst_costume_id'] for v in first['favorite_costume_list']],\n            params['mst_costume_id_list'],\n        )\n        self.assertEqual(first, second)\n        self.assertEqual(self._stored_ids(), params['mst_costume_id_list'])\n\n        with Session(engine) as session:\n            idol = session.scalar(select(Idol).where(Idol.idol_id == self.idol.idol_id))\n            serialized = IdolSchema().dump(idol)\n        self.assertEqual(\n            [v['mst_costume_id'] for v in serialized['favorite_costume_list']],\n            params['mst_costume_id_list'],\n        )\n\n        cleared = set_favorite_costume(\n            {'mst_idol_id': self.mst_idol_id, 'mst_costume_id_list': []},\n            self.context,\n        )\n        self.assertEqual(cleared, {'favorite_costume_list': []})\n        self.assertEqual(self._stored_ids(), [])\n\n    def test_invalid_request_does_not_destroy_prior_state(self):\n        set_favorite_costume({\n            'mst_idol_id': self.mst_idol_id,\n            'mst_costume_id_list': [self.costume_ids[0]],\n        }, self.context)\n        with self.assertRaises(ValueError):\n            set_favorite_costume({\n                'mst_idol_id': self.mst_idol_id,\n                'mst_costume_id_list': [self.costume_ids[0], 2147483647],\n            }, self.context)\n        self.assertEqual(self._stored_ids(), [self.costume_ids[0]])\n\n    def test_duplicate_is_rejected_without_mutation(self):\n        with self.assertRaises(ValueError):\n            set_favorite_costume({\n                'mst_idol_id': self.mst_idol_id,\n                'mst_costume_id_list': [self.costume_ids[0], self.costume_ids[0]],\n            }, self.context)\n        self.assertEqual(self._stored_ids(), [])\n\n\nif __name__ == '__main__':\n    unittest.main(verbosity=2)\n'''.lstrip())
          PY
      - name: Smoke compile
        run: python -m compileall -q standalone/mltd tests/test_favorite_costume_runtime.py
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add standalone/mltd/models/models.py standalone/mltd/models/schemas.py standalone/mltd/models/setup.py standalone/mltd/services/idol.py tests/test_favorite_costume_runtime.py
          git commit -m 'fix: persist idol favorite costumes'
          git push origin HEAD:fix/story-service-compat
