name: Build StoryService compatibility test

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - 'standalone/**'
      - 'requirements.txt'
      - '.github/workflows/build-story-service-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build Ubuntu standalone
        run: |
          source env/bin/activate
          cd standalone
          ../env/bin/pyinstaller gui_ubuntu.spec
      - name: Package StoryService test build
        run: |
          mkdir -p test-output
          cp standalone/dist/mltd-relive-standalone test-output/mltd-relive-v0.1.10-story-service-test-ubuntu
          chmod +x test-output/mltd-relive-v0.1.10-story-service-test-ubuntu
          printf '%s\n' \
            'Branch: fix/story-service-compat' \
            "Commit: ${GITHUB_SHA}" \
            'Purpose: corrected-client StoryService RPC/state-machine smoke test.' \
            'Includes FinishCostumeAdv, FinishEpisode, FinishMainStory, FinishMemorial, FinishOfferStory, FinishSpecialStory, PlayStoryMV, and legacy GetSpecialList compatibility.' \
            > test-output/TEST_BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mltd-relive-v0.1.10-story-service-test-ubuntu
          path: test-output/*
          if-no-files-found: error
          retention-days: 7
