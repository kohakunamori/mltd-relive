name: Update final server compatibility handoff

on:
  push:
    branches: [fix/story-service-compat]
    paths: ['.github/workflows/update-server-compat-handoff-final.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-service-compat
          fetch-depth: 0
      - name: Append final pre-device checkpoint
        env:
          APPENDIX_B64: ''
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          p = Path('docs/SERVER_COMPAT_AGENT_HANDOFF.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 13. Final pre-device acceptance checkpoint (2026-09-03)'
          if marker not in text:
              appendix = base64.b64decode(os.environ['APPENDIX_B64']).decode('utf-8')
              p.write_text(text.rstrip() + '\n\n' + appendix, encoding='utf-8')
          PY
      - name: Commit handoff update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SERVER_COMPAT_AGENT_HANDOFF.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: record final server compatibility acceptance'
          git push origin HEAD:fix/story-service-compat
