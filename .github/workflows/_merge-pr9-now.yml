name: Temporary merge PR 9

on:
  push:
    branches:
      - client-source-extraction
    paths:
      - '.github/workflows/_merge-pr9-now.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 9 --repo "$GITHUB_REPOSITORY"

      - name: Squash merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge 9
          --repo "$GITHUB_REPOSITORY"
          --squash
          --subject "client: make zh-fixed APK reproducibly inspectable and diffable (#9)"
          --body "Merge the reproducible zh-fixed client maintenance source, documentation, extraction tooling, and complete decompilation publishing workflow."
