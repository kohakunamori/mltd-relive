name: Analyze captured AppGuard trampolines

on:
  workflow_dispatch:
  push:
    branches:
      - client-zh-fixed-reconstruction
    paths:
      - '.github/workflows/analyze-emulated-appguard-trampolines.yml'
      - 'tools/client-source/analyze-appguard-emulated-trampolines.py'
      - 'client/reconstruction/appguard-analysis/emulation/**'

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python -m pip install --disable-pip-version-check capstone
      - name: Decode runtime descriptors and dispatch slots
        run: |
          python tools/client-source/analyze-appguard-emulated-trampolines.py \
            --emulation-dir client/reconstruction/appguard-analysis/emulation \
            --out client/reconstruction/appguard-analysis/emulation
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/reconstruction/appguard-analysis/emulation/runtime-trampoline-analysis.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'client: decode runtime AppGuard trampoline table'
          git push origin HEAD:client-zh-fixed-reconstruction
