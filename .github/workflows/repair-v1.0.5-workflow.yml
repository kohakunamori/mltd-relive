name: Repair v1.0.5 patch workflow

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-v1.0.5-workflow.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix regex replacement callbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/fix-patcher-v1.0.5.yml')
          text = p.read_text(encoding='utf-8')
          old1 = "              new_signer_parser + '\\n\\ndef payload_snapshot',"
          new1 = "              lambda _: new_signer_parser + '\\n\\ndef payload_snapshot',"
          old2 = "          text, count = old_verify_pattern.subn(new_verify, text, count=1)"
          new2 = "          text, count = old_verify_pattern.subn(lambda _: new_verify, text, count=1)"
          if old1 not in text or old2 not in text:
              raise SystemExit('expected workflow lines were not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-patcher-v1.0.5.yml
          git commit -m 'ci: fix v1.0.5 patch workflow regex replacement'
          git push origin HEAD:main
