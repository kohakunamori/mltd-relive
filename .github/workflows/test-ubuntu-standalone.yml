name: Test Ubuntu Standalone GUI

on:
  pull_request:
    paths:
      - 'standalone/**'
      - 'requirements.txt'
      - '.github/workflows/test-ubuntu-standalone.yml'
      - '.github/workflows/build-and-release.yml'
      - 'tools/smoke-test-ubuntu-gui.sh'
      - 'tests/test_ubuntu_standalone_packaging.py'
  push:
    branches:
      - main
    paths:
      - 'standalone/**'
      - 'requirements.txt'
      - '.github/workflows/test-ubuntu-standalone.yml'
      - '.github/workflows/build-and-release.yml'
      - 'tools/smoke-test-ubuntu-gui.sh'
      - 'tests/test_ubuntu_standalone_packaging.py'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test packaging and smoke-test failure handling
        run: python -m unittest discover -s tests -p 'test_ubuntu_standalone_packaging.py' -v

      - name: Install build and GUI test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libtk8.6 libtcl8.6 xvfb xauth
          python -m venv env
          source env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Ubuntu GUI standalone
        shell: bash
        run: |
          set -euo pipefail
          cd standalone
          ../env/bin/pyinstaller gui_ubuntu.spec

      - name: Verify bundled Tcl/Tk libraries and complete notices
        shell: bash
        run: |
          set -euo pipefail
          cd standalone
          ../env/bin/python - <<'PY'
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader

          archive = CArchiveReader('dist/mltd-relive-standalone')
          for library in ('libtk8.6.so', 'libtcl8.6.so'):
              assert library in archive.toc, f'Missing bundled library: {library}'
          filename = 'mltd-relive-standalone-ubuntu-NOTICES.txt'
          embedded = archive.extract(f'licenses/{filename}')
          assert embedded == (Path('dist') / filename).read_bytes()
          for package in ('libtk8.6', 'libtcl8.6'):
              original = (Path('/usr/share/doc') / package / 'copyright').read_bytes()
              assert original.strip() and original in embedded, f'Incomplete notice: {package}'
          print('Both shared libraries and complete package notices are bundled.')
          PY

      - name: Smoke-test GUI under Xvfb
        shell: bash
        run: bash tools/smoke-test-ubuntu-gui.sh standalone/dist/mltd-relive-standalone
