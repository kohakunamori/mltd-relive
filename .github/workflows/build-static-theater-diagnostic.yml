name: Build static Theater diagnostic

on:
  push:
    branches:
      - diagnose/v0.1.9-static-theater

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify GetTheater override
        run: |
          cd standalone
          PYTHONPATH=. python - <<'PY'
          from jsonrpc import dispatcher
          from mltd.servers import handler
          method = dispatcher['TheaterService.GetTheater']
          result = method({})
          theater = result['theater']
          assert theater['room_list'] == []
          assert theater['idol_booking_list'] == []
          assert theater['prior_lot_rate_table_list'] == []
          print('static Theater dispatcher override: PASS')
          PY
      - name: Build Ubuntu package
        run: |
          cd standalone
          pyinstaller gui_ubuntu.spec
      - uses: actions/upload-artifact@v4
        with:
          name: mltd-relive-v0.1.9-static-theater-ubuntu
          path: standalone/dist
