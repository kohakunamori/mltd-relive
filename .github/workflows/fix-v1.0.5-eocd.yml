name: Normalize v1.0.5 EOCD magic

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-v1.0.5-eocd.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace EOCD literal with byte tuple
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apk-patcher/apk-patcher.pyw')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          found = 0
          for i, line in enumerate(lines):
              if 'eocd_offset = tail.rfind(' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + 'eocd_offset = tail.rfind(bytes((0x50, 0x4B, 0x05, 0x06)))'
                  found += 1
          if found != 1:
              raise SystemExit(f'expected one EOCD lookup, found {found}')
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile tools/apk-patcher/apk-patcher.pyw
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apk-patcher/apk-patcher.pyw
          git commit -m 'fix(apk-patcher): make EOCD signature lookup unambiguous'
          git push origin HEAD:main
