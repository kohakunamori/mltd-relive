name: Test hybrid upstream fallback

on:
  push:
    branches:
      - fix/hybrid-upstream-fallback

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test fallback semantics
        run: python tools/test_hybrid_upstream_fallback.py
      - name: Build Ubuntu diagnostic package
        run: |
          cd standalone
          pyinstaller gui_ubuntu.spec
      - uses: actions/upload-artifact@v4
        with:
          name: mltd-relive-hybrid-upstream-fallback-ubuntu
          path: standalone/dist
