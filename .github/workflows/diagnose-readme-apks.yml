name: Diagnose README APK variants

on:
  push:
    branches:
      - diagnose/login-regression-20260902

jobs:
  compare-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pycryptodome
          sudo apt-get update
          sudo apt-get install -y apktool megatools

      - name: Download the four README APKs with megatools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-analysis/apks
          download_mega() {
            local name="$1"
            local modern="$2"
            local legacy="$3"
            local out="apk-analysis/apks/${name}.apk"
            if ! megatools dl --no-progress --path - "$modern" > "${out}.part"; then
              rm -f "${out}.part"
              megatools dl --no-progress --path - "$legacy" > "${out}.part"
            fi
            mv "${out}.part" "$out"
            ls -lh "$out"
            sha256sum "$out"
          }
          download_mega zh-termux \
            'https://mega.nz/file/7B5VHK4T#AR3olYRjV8Y_-sxPvZltoc3YCDQi4VdsTdMrYWNHK1g' \
            'https://mega.nz/#!7B5VHK4T!AR3olYRjV8Y_-sxPvZltoc3YCDQi4VdsTdMrYWNHK1g'
          download_mega zh-desktop \
            'https://mega.nz/file/HMgiTSbI#cy7z52H6zBOSdSX5Xok1GKQ4yT7k6K1ctjV6Heceu3I' \
            'https://mega.nz/#!HMgiTSbI!cy7z52H6zBOSdSX5Xok1GKQ4yT7k6K1ctjV6Heceu3I'
          download_mega ko-termux \
            'https://mega.nz/file/iJohWQbC#KqauZ-10selJMon1NhIIbsiWXte14Rs0n81jGaDDR3E' \
            'https://mega.nz/#!iJohWQbC!KqauZ-10selJMon1NhIIbsiWXte14Rs0n81jGaDDR3E'
          download_mega ko-desktop \
            'https://mega.nz/file/2dBgiBQY#NBgo-1rTW7g1Jtm9FLYZ61KoOP4HFoElxO75dzMyXew' \
            'https://mega.nz/#!2dBgiBQY!NBgo-1rTW7g1Jtm9FLYZ61KoOP4HFoElxO75dzMyXew'

      - name: Compare APK payloads
        run: |
          python tools/analyze_readme_apks.py apk-analysis

      - name: Locate Android SDK tools
        id: sdk
        shell: bash
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          echo "aapt=$AAPT" >> "$GITHUB_OUTPUT"
          echo "apksigner=$APKSIGNER" >> "$GITHUB_OUTPUT"
          echo "AAPT=$AAPT"
          echo "APKSIGNER=$APKSIGNER"

      - name: Dump package, manifest, permissions and signatures
        shell: bash
        run: |
          mkdir -p apk-analysis/android-tools
          for apk in apk-analysis/apks/*.apk; do
            base=$(basename "$apk" .apk)
            {
              echo '=== BADGING ==='
              "${{ steps.sdk.outputs.aapt }}" dump badging "$apk" || true
              echo '=== PERMISSIONS ==='
              "${{ steps.sdk.outputs.aapt }}" dump permissions "$apk" || true
              echo '=== MANIFEST XMLTREE ==='
              "${{ steps.sdk.outputs.aapt }}" dump xmltree "$apk" AndroidManifest.xml || true
            } > "apk-analysis/android-tools/${base}.aapt.txt" 2>&1
            "${{ steps.sdk.outputs.apksigner }}" verify --verbose --print-certs "$apk" \
              > "apk-analysis/android-tools/${base}.apksigner.txt" 2>&1 || true
          done

      - name: Decode APKs with apktool
        shell: bash
        run: |
          mkdir -p apk-analysis/apktool
          for apk in apk-analysis/apks/*.apk; do
            base=$(basename "$apk" .apk)
            apktool d -f -o "apk-analysis/apktool/$base" "$apk" >/tmp/apktool-$base.log 2>&1 || {
              cat /tmp/apktool-$base.log
              exit 1
            }
          done

      - name: Produce decoded same-region diffs
        shell: bash
        run: |
          mkdir -p apk-analysis/diffs
          diff -qr apk-analysis/apktool/zh-termux apk-analysis/apktool/zh-desktop \
            > apk-analysis/diffs/zh-termux-vs-desktop.files.txt || true
          diff -qr apk-analysis/apktool/ko-termux apk-analysis/apktool/ko-desktop \
            > apk-analysis/diffs/ko-termux-vs-desktop.files.txt || true

          for region in zh ko; do
            for mode in termux desktop; do
              root="apk-analysis/apktool/${region}-${mode}"
              grep -RInaE 'https?://|theaterdays|rainbowunicorn|appspot|localhost|127\.0\.0\.1|7650|7651|cleartext|networkSecurityConfig|TrustManager|HostnameVerifier|Certificate' "$root" \
                > "apk-analysis/diffs/${region}-${mode}.network-grep.txt" || true
            done
          done

          echo '=== ZH decoded differing files ==='
          cat apk-analysis/diffs/zh-termux-vs-desktop.files.txt
          echo '=== KO decoded differing files ==='
          cat apk-analysis/diffs/ko-termux-vs-desktop.files.txt
          echo '=== ZH TERMUX network strings ==='
          cat apk-analysis/diffs/zh-termux.network-grep.txt
          echo '=== ZH DESKTOP network strings ==='
          cat apk-analysis/diffs/zh-desktop.network-grep.txt
          echo '=== KO TERMUX network strings ==='
          cat apk-analysis/diffs/ko-termux.network-grep.txt
          echo '=== KO DESKTOP network strings ==='
          cat apk-analysis/diffs/ko-desktop.network-grep.txt

      - name: Upload forensic report
        uses: actions/upload-artifact@v4
        with:
          name: readme-apk-forensics
          path: |
            apk-analysis/summary.txt
            apk-analysis/report.json
            apk-analysis/android-tools/
            apk-analysis/diffs/
          retention-days: 7
