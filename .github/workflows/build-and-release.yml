name: Build and Release

on:
  push:
    tags:
      - 'standalone-v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'standalone-v0.1.3' }}
  PATCHER_VERSION: v1.0.6

jobs:
  build:
    name: Build standalone packages
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release standalone-v0.1.3]')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: Windows
            cmd-install: |
              python -m venv env
              .\env\Scripts\activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd standalone
              ..\env\Scripts\pyinstaller gui_windows.spec
            package-source: standalone/dist/mltd-relive-standalone.exe
            package-suffix: windows.exe
            out-name: windows
          - os: ubuntu-latest
            target: Ubuntu
            cmd-install: |
              python -m venv env
              source env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd standalone
              ../env/bin/pyinstaller gui_ubuntu.spec
            package-source: standalone/dist/mltd-relive-standalone
            package-suffix: ubuntu
            out-name: ubuntu
          - os: macos-latest
            target: macOS
            cmd-install: |
              python -m venv env
              source env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd standalone
              ../env/bin/pyinstaller gui_macos.spec
            package-source: standalone/dist/mltd-relive-standalone.app
            package-suffix: macos.zip
            out-name: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for ${{ matrix.target }}
        run: ${{ matrix.cmd-install }}

      - name: Build with PyInstaller for ${{ matrix.target }}
        run: ${{ matrix.cmd-build }}

      - name: Package release file
        shell: bash
        env:
          PACKAGE_SOURCE: ${{ matrix.package-source }}
          PACKAGE_SUFFIX: ${{ matrix.package-suffix }}
        run: |
          set -euo pipefail
          mkdir -p standalone/dist/release-output
          if [[ "$PACKAGE_SOURCE" == *.app ]]; then
            (
              cd standalone/dist
              zip -r9 "release-output/mltd-relive-${RELEASE_TAG}-${PACKAGE_SUFFIX}" "$(basename "$PACKAGE_SOURCE")"
            )
          else
            cp "$PACKAGE_SOURCE" "standalone/dist/release-output/mltd-relive-${RELEASE_TAG}-${PACKAGE_SUFFIX}"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out-name }}
          path: standalone/dist/release-output/*
          if-no-files-found: error

  patcher:
    name: Build APK Patcher packages
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release standalone-v0.1.3]')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: Windows
            cmd-install: |
              python -m venv env
              .\env\Scripts\activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd tools\apk-patcher
              ..\..\env\Scripts\pyinstaller apk-patcher_windows.spec
            package-source: tools/apk-patcher/dist/mltd-relive-apk-patcher.exe
            package-suffix: windows.exe
            out-name: patcher-windows
          - os: ubuntu-latest
            target: Ubuntu
            cmd-install: |
              python -m venv env
              source env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd tools/apk-patcher
              ../../env/bin/pyinstaller apk-patcher_ubuntu.spec
            package-source: tools/apk-patcher/dist/mltd-relive-apk-patcher
            package-suffix: ubuntu
            out-name: patcher-ubuntu
          - os: macos-latest
            target: macOS
            cmd-install: |
              python -m venv env
              source env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd tools/apk-patcher
              ../../env/bin/pyinstaller apk-patcher_macos.spec
            package-source: tools/apk-patcher/dist/mltd-relive-apk-patcher.app
            package-suffix: macos.zip
            out-name: patcher-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for ${{ matrix.target }}
        run: ${{ matrix.cmd-install }}

      - name: Build APK Patcher for ${{ matrix.target }}
        run: ${{ matrix.cmd-build }}

      - name: Package APK Patcher
        shell: bash
        env:
          PACKAGE_SOURCE: ${{ matrix.package-source }}
          PACKAGE_SUFFIX: ${{ matrix.package-suffix }}
        run: |
          set -euo pipefail
          mkdir -p tools/apk-patcher/dist/release-output
          if [[ "$PACKAGE_SOURCE" == *.app ]]; then
            (
              cd tools/apk-patcher/dist
              zip -r9 "release-output/mltd-relive-apk-patcher-${PATCHER_VERSION}-${PACKAGE_SUFFIX}" "$(basename "$PACKAGE_SOURCE")"
            )
          else
            cp "$PACKAGE_SOURCE" "tools/apk-patcher/dist/release-output/mltd-relive-apk-patcher-${PATCHER_VERSION}-${PACKAGE_SUFFIX}"
          fi

      - name: Upload APK Patcher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out-name }}
          path: tools/apk-patcher/dist/release-output/*
          if-no-files-found: error

  gameclient:
    name: Prepare corrected game clients
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release standalone-v0.1.3]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MEGA download tools
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools unzip

      - name: Download corrected Traditional Chinese client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game-client
          output='game-client/mltd-relive-game-client-zh-fixed.apk'
          modern='https://mega.nz/file/HMgiTSbI#cy7z52H6zBOSdSX5Xok1GKQ4yT7k6K1ctjV6Heceu3I'
          legacy='https://mega.nz/#!HMgiTSbI!cy7z52H6zBOSdSX5Xok1GKQ4yT7k6K1ctjV6Heceu3I'
          if ! megatools dl --no-progress --path - "$modern" > "${output}.part"; then
            rm -f "${output}.part"
            megatools dl --no-progress --path - "$legacy" > "${output}.part"
          fi
          mv "${output}.part" "$output"

      - name: Download corrected Korean client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game-client
          output='game-client/mltd-relive-game-client-ko-fixed.apk'
          modern='https://mega.nz/file/2dBgiBQY#NBgo-1rTW7g1Jtm9FLYZ61KoOP4HFoElxO75dzMyXew'
          legacy='https://mega.nz/#!2dBgiBQY!NBgo-1rTW7g1Jtm9FLYZ61KoOP4HFoElxO75dzMyXew'
          if ! megatools dl --no-progress --path - "$modern" > "${output}.part"; then
            rm -f "${output}.part"
            megatools dl --no-progress --path - "$legacy" > "${output}.part"
          fi
          mv "${output}.part" "$output"

      - name: Validate game client packages
        shell: bash
        run: |
          set -euo pipefail
          for apk in game-client/*.apk; do
            test "$(stat -c%s "$apk")" -gt 10000000
            unzip -tq "$apk"
            unzip -p "$apk" AndroidManifest.xml > /dev/null
          done
          cp GAME_CLIENT_NOTICE.txt game-client/GAME_CLIENT_NOTICE.txt
          (
            cd game-client
            sha256sum *.apk > SHA256SUMS.txt
          )

      - name: Upload game client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-client
          path: game-client/*
          if-no-files-found: error

  createrelease:
    name: Create or update Release
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release standalone-v0.1.3]')
    needs:
      - build
      - patcher
      - gameclient
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or update Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          name: mltd-relive-${{ env.RELEASE_TAG }}
          bodyFile: GAME_CLIENT_NOTICE.txt
          artifacts: 'LICENSE,release-artifacts/windows/*,release-artifacts/ubuntu/*,release-artifacts/macos/*,release-artifacts/patcher-windows/*,release-artifacts/patcher-ubuntu/*,release-artifacts/patcher-macos/*,release-artifacts/game-client/*'
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
