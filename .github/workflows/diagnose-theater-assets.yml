name: Diagnose theater assets

on:
  push:
    branches:
      - diagnose/login-regression-20260902

jobs:
  theater-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python tools/diagnose_theater_assets.py
      - run: python tools/diagnose_card_contact_assets.py
