name: Audit next active RPC contracts

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-next-rpc-contracts.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Dump exact costume RPC contract
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          python - <<'PY'
          import pathlib, re
          dump = pathlib.Path('/tmp/dump.cs').read_text(encoding='utf-8', errors='ignore')

          for needle in ('CostumeService.GetCostumeList', 'CostumeService.SetCostume'):
              print(f'=== OCCURRENCES {needle} ===')
              for m in re.finditer(re.escape(needle), dump):
                  lo=max(0,m.start()-2600); hi=min(len(dump),m.end()+3600)
                  print(dump[lo:hi])
                  print('\n---\n')

          print('=== CLASSES WITH COSTUME FIELDS ===')
          for m in re.finditer(r'public class ([A-Za-z0-9_.+`]+)\b[^\n]*\n\{', dump):
              start=m.start(); end=dump.find('\n// Namespace:', start+1)
              if end < 0: end=min(len(dump), start+12000)
              block=dump[start:end]
              fields=re.findall(r'^\s*public\s+([^;\n]+?)\s+([A-Za-z0-9_]+);', block, flags=re.M)
              if not fields:
                  continue
              if any('costume' in field.lower() for _,field in fields):
                  print(f'=== CLASS {m.group(1)} ===')
                  for typ,field in fields:
                      if ('costume' in field.lower() or field in {
                          'mission_process','mission_list','idol_list','user_id'
                      }):
                          print(typ.strip(), field)
          PY
          echo '=== SERVER COSTUME MODELS ==='
          grep -n -A100 -B5 -E '^class (Costume|MstCostume|Idol|UnitIdol|SongUnitIdol)\b' standalone/mltd/models/models.py | head -n 1200 || true
          echo '=== COSTUME USAGE ==='
          grep -RIn -C 5 -E 'mst_costume_id|costume_id|Costume\(' standalone/mltd/services | head -n 1600 || true
