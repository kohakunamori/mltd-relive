name: Audit next active RPC contracts

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-next-rpc-contracts.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Trace ItemService consumer semantics
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          python - <<'PY'
          import pathlib, re
          dump = pathlib.Path('/tmp/dump.cs').read_text(encoding='utf-8', errors='ignore')

          def class_fields(name):
              m = re.search(rf'public class {re.escape(name)}\b.*?\{{(.*?)\n\s*// Methods', dump, flags=re.S)
              print(f'=== {name} ===')
              if not m:
                  print('NOT FOUND'); return
              for typ, field in re.findall(r'^\s*public\s+([^;\n]+?)\s+([A-Za-z0-9_]+);', m.group(1), flags=re.M):
                  print(typ.strip(), field)

          for name in (
              'UseGiftForCardArgs','UseGiftForCardReply',
              'UseGiftForIdolGiftArgs','UseGiftForIdolGiftReply',
              'UseItemArgs','UseItemReply','ResultIdol','CardStatus','IdolStatus'
          ):
              class_fields(name)

          patterns = (
              r'\.UseItem\(', r'new UseItemArgs', r'UseItemReply',
              r'\.UseGiftForCard\(', r'new UseGiftForCardArgs', r'UseGiftForCardReply',
              r'\.UseGiftForIdolGift\(', r'new UseGiftForIdolGiftArgs', r'UseGiftForIdolGiftReply',
          )
          for pat in patterns:
              print(f'=== CONTEXT {pat} ===')
              matches=list(re.finditer(pat, dump))
              print('COUNT', len(matches))
              for i,m in enumerate(matches[:30]):
                  print(f'--- {i+1} @{m.start()} ---')
                  print(dump[max(0,m.start()-2200):min(len(dump),m.end()+3000)])
          PY
