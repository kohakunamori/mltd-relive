name: Audit next active RPC contracts

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-next-rpc-contracts.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Dump core offline RPC contracts
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          python - <<'PY'
          import pathlib, re
          dump = pathlib.Path('/tmp/dump.cs').read_text(encoding='utf-8', errors='ignore')
          methods = [
              'FriendService.GetFriendList', 'FriendService.RequestFriend',
              'FriendService.AcceptFriend', 'FriendService.RemoveFriend',
              'FriendService.GetCommentList', 'FriendService.SendComment',
              'FriendService.GetFlowerStandList', 'FriendService.SendFlowerStand',
              'FriendService.SendFlowerStandMulti', 'FriendService.ExecFlowerStandReward',
              'CostumeService.GetCostumeList', 'CostumeService.SetCostume',
              'PresentService.GetPresentHistory', 'NaviService.GetNaviList',
              'DramaService.GetDramaList', 'BlogService.GetBlogList',
              'BlogService.LikeBlog', 'BlogService.ReadBlog',
              'MailService.GetMailList', 'MailService.ReadMail', 'MailService.ResponseMail',
          ]
          for method in methods:
              print(f'=== RPC {method} ===')
              pos = dump.find(method)
              if pos < 0:
                  print('NOT FOUND')
              else:
                  lo = max(0, pos - 1800); hi = min(len(dump), pos + 2200)
                  print(dump[lo:hi])

          targets = [
              'GetFriendListArgs','GetFriendListReply','RequestFriendArgs','RequestFriendReply',
              'AcceptFriendArgs','AcceptFriendReply','RemoveFriendArgs','RemoveFriendReply',
              'GetCommentListArgs','GetCommentListReply','SendCommentArgs','SendCommentReply',
              'GetFlowerStandListArgs','GetFlowerStandListReply','SendFlowerStandArgs','SendFlowerStandReply',
              'SendFlowerStandMultiArgs','SendFlowerStandMultiReply','ExecFlowerStandRewardArgs','ExecFlowerStandRewardReply',
              'GetCostumeListArgs','GetCostumeListReply','SetCostumeArgs','SetCostumeReply',
              'GetPresentHistoryArgs','GetPresentHistoryReply','GetNaviListArgs','GetNaviListReply',
              'GetDramaListArgs','GetDramaListReply','GetBlogListArgs','GetBlogListReply',
              'LikeBlogArgs','LikeBlogReply','ReadBlogArgs','ReadBlogReply',
              'GetMailListArgs','GetMailListReply','ReadMailArgs','ReadMailReply','ResponseMailArgs','ResponseMailReply',
              'FriendStatus','FriendSummary','FriendComment','FlowerStand','CostumeStatus','NaviStatus','BlogStatus','MailStatus',
          ]
          for name in targets:
              match = re.search(rf'public class {name}\b.*?\{{(.*?)\n\s*// Methods', dump, flags=re.S)
              if not match:
                  continue
              print(f'=== CLASS {name} ===')
              for typ, field in re.findall(r'^\s*public\s+([^;\n]+?)\s+([A-Za-z0-9_]+);', match.group(1), flags=re.M):
                  print(typ.strip(), field)
          PY
          echo '=== SERVER FRIEND/COSTUME MODELS ==='
          grep -n -A90 -B5 -E '^class (Friend|Costume|Profile|Present|MstCostume)\b' standalone/mltd/models/models.py | head -n 900 || true
          echo '=== EXISTING FRIEND/COSTUME SCHEMAS/USAGE ==='
          grep -RIn -C 4 -E 'FriendSchema|GuestSchema|CostumeSchema|Friend\(|Costume\(' standalone/mltd | head -n 1200 || true
