name: Audit next active RPC contracts

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-next-rpc-contracts.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Dump exact core DTOs, enums and server support
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          python - <<'PY'
          import pathlib, re
          dump = pathlib.Path('/tmp/dump.cs').read_text(encoding='utf-8', errors='ignore')

          wanted_exact = {
              'CommentStatus','FlowerStandCountStatus','FlowerStandStatus',
              'PresentHistoryStatus','DramaStatus','NaviStatus','CostumeStatus',
              'FriendStatus','GetFriendListArgs','GetFriendListReply',
              'RequestFriendArgs','RequestFriendReply','AcceptFriendArgs','AcceptFriendReply',
              'RemoveFriendArgs','RemoveFriendReply',
          }
          # Also discover every API DTO whose class name contains one of these
          # domain terms so we do not depend on guessed Args/Reply names.
          domain_terms = ('Costume', 'PresentHistory', 'Drama', 'Friend', 'FlowerStand', 'Comment')
          names = []
          for m in re.finditer(r'public class ([A-Za-z0-9_.+`]+)\b[^\n]*\n\{', dump):
              raw = m.group(1)
              short = raw.rsplit('.', 1)[-1]
              if short in wanted_exact or any(term in short for term in domain_terms):
                  names.append(short)
          seen = set()
          for name in names:
              if name in seen:
                  continue
              seen.add(name)
              match = re.search(rf'public class (?:[A-Za-z0-9_.]+\.)?{re.escape(name)}\b.*?\{{(.*?)\n\s*// Methods', dump, flags=re.S)
              if not match:
                  continue
              fields = re.findall(r'^\s*public\s+([^;\n]+?)\s+([A-Za-z0-9_]+);', match.group(1), flags=re.M)
              if not fields:
                  continue
              print(f'=== CLASS {name} ===')
              for typ, field in fields:
                  print(typ.strip(), field)

          print('=== FRIEND ENUM/STATE CONTEXT ===')
          for pat in ('FriendState', 'friend_state'):
              for m in list(re.finditer(pat, dump))[:30]:
                  lo=max(0,m.start()-500); hi=min(len(dump),m.start()+900)
                  print(dump[lo:hi].replace('\x00',''))
                  print('---')
          PY

          echo '=== SERVER CORE MODELS ==='
          grep -n -A100 -B5 -E '^class (MstNavi|Navi|MstDrama|Drama|MstBlog|Blog|MstMail|Mail|PresentHistory|Friend|Costume|MstCostume)\b' standalone/mltd/models/models.py || true
          echo '=== CORE MODEL/DATA FILE REFERENCES ==='
          grep -RIn -E 'MstNavi|NaviStatus|mst_navi|MstDrama|DramaStatus|mst_drama|MstBlog|BlogStatus|mst_blog|MstMail|MailStatus|mst_mail|PresentHistory|present_history' standalone/mltd | head -n 1400 || true
          echo '=== COSTUME/FRIEND UNIT STATE FIELDS ==='
          grep -n -A100 -B5 -E '^class (UnitIdol|SongUnitIdol|RandomLiveIdol|TheaterRoomIdol|Friend)\b' standalone/mltd/models/models.py | head -n 900 || true
          echo '=== PRESENT SCHEMAS ==='
          grep -n -A180 -B10 -E '^class (PresentSchema|ItemSchema)\b' standalone/mltd/models/schemas.py | head -n 500 || true
          echo '=== PRESENT RECEIVE DELETE/STATE ==='
          grep -n -A18 -B10 -E 'session\.delete\(present\)|present_state' standalone/mltd/services/present.py | head -n 500 || true
