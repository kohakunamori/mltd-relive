name: Audit next active RPC contracts

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-next-rpc-contracts.yml'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Dump client mission contracts
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          python - <<'PY'
          import pathlib, re
          dump = pathlib.Path('/tmp/dump.cs').read_text(encoding='utf-8', errors='ignore')
          targets = (
              'ClientMission',
              'DoClientMissionArgs',
              'DoClientMissionReply',
              'MissionProcessStatus',
              'MissionStatus',
              'TrainingPointDiff',
          )
          for name in targets:
              print(f'=== {name} ===')
              match = re.search(rf'public class {name}\b.*?\{{(.*?)\n\s*// Methods', dump, flags=re.S)
              if not match:
                  print('NOT FOUND')
                  continue
              for typ, field in re.findall(r'^\s*public\s+([^;\n]+?)\s+([A-Za-z0-9_]+);', match.group(1), flags=re.M):
                  print(typ.strip(), field)
          PY
          echo '=== CURRENT CLIENT-MISSION CLASS IDS ==='
          grep -RIn -C 3 'mst_mission_class_id.*==' standalone/mltd/services | head -n 500 || true
