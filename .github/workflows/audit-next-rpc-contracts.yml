name: Audit next active RPC contracts

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-next-rpc-contracts.yml'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - run: >-
          python -m pip install
          json-rpc==1.15.0
          SQLAlchemy==2.0.19 SQLAlchemy-Utils==0.41.1
          marshmallow==3.20.1 marshmallow-sqlalchemy==0.29.0
          msgpack==1.0.5 pycryptodome==3.18.0
      - name: Extract compact client vitality contracts
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          for cls in ItemStatus RecoverVitalityByItemArgs RecoverVitalityByItemReply RecoverVitalityByItemMultiArgs RecoverVitalityByItemMultiReply RecoverVitalityByJewelReply; do
            echo "=== ${cls} ==="
            line=$(grep -n -m1 -E "public class ${cls}\\b" /tmp/dump.cs | cut -d: -f1 || true)
            if [ -n "$line" ]; then
              sed -n "${line},$((line+45))p" /tmp/dump.cs
            fi
          done
          echo '=== VITALITY RECOVERY CLIENT CALCULATION REFERENCES ==='
          grep -n -E 'RecoverVitalityBy(Item|ItemMulti|Jewel)|full_recover_date|before_jewel|after_free_jewel|after_paid_jewel' /tmp/dump.cs | head -n 350 || true
      - name: Show every server vitality timeline reference
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn -C 8 -E 'vitality_recovery_time|full_recover_date|auto_recover_interval|recovery_value|recovery_max_value' standalone/mltd || true
      - name: Initialize DB and query vitality master data
        working-directory: standalone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sqlalchemy import select
          from sqlalchemy.orm import Session
          from mltd.models.setup import setup
          from mltd.models.engine import engine
          from mltd.models.models import MstItem, MstGameSetting, User
          setup()
          with Session(engine) as s:
              print('=== ITEM_TYPE_6 ===')
              for i in s.scalars(select(MstItem).where(MstItem.item_type == 6).order_by(MstItem.mst_item_id)).all():
                  print(i.mst_item_id, repr(i.name), 'value1=', i.value1, 'value2=', i.value2, 'recovery_value=', i.recovery_value, 'recovery_max_value=', i.recovery_max_value)
              print('=== GAME_SETTING ===')
              gs = s.scalars(select(MstGameSetting)).first()
              print('auto_recover_interval=', gs.auto_recover_interval, 'max_stamina=', gs.max_stamina)
              print('=== ADMIN_USER ===')
              u = s.scalars(select(User)).first()
              print('vitality=', u.vitality, 'max_vitality=', u.max_vitality, 'vitality_recovery_time=', u.vitality_recovery_time, 'full_recover_date=', u.full_recover_date, 'free_jewel=', u.free_jewel, 'paid_jewel=', u.paid_jewel)
          PY
      - name: Print ItemSchema implementation
        shell: bash
        run: |
          grep -RIn -A 55 -B 4 -E '^class ItemSchema\\b' standalone/mltd/models/schemas.py || true
