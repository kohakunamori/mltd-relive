name: Audit next active RPC contracts

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-next-rpc-contracts.yml'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - run: >-
          python -m pip install
          json-rpc==1.15.0
          SQLAlchemy==2.0.19 SQLAlchemy-Utils==0.41.1
          marshmallow==3.20.1 marshmallow-sqlalchemy==0.29.0
          msgpack==1.0.5 pycryptodome==3.18.0
      - name: Extract compact client vitality contracts
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          for cls in ItemStatus RecoverVitalityByItemArgs RecoverVitalityByItemReply RecoverVitalityByItemMultiArgs RecoverVitalityByItemMultiReply RecoverVitalityByJewelReply; do
            echo "=== ${cls} ==="
            line=$(grep -n -m1 -E "public class ${cls}\\b" /tmp/dump.cs | cut -d: -f1 || true)
            if [ -n "$line" ]; then
              sed -n "${line},$((line+45))p" /tmp/dump.cs
            fi
          done
      - name: Show every server vitality timeline reference
        shell: bash
        run: |
          grep -RIn -C 8 -E 'full_recover_date|auto_recover_interval' standalone/mltd || true
      - name: Initialize DB and query vitality master data
        working-directory: standalone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from sqlalchemy import select
          from sqlalchemy.orm import Session
          from mltd.models.setup import setup
          from mltd.models.engine import engine
          from mltd.models.models import Jewel, MstItem, MstGameSetting, User
          setup()
          with Session(engine) as s:
              print('=== ITEM_TYPE_6 ===')
              for i in s.scalars(select(MstItem).where(MstItem.item_type == 6).order_by(MstItem.mst_item_id)).all():
                  print(i.mst_item_id, repr(i.name), 'value1=', i.value1, 'value2=', i.value2, 'max_amount=', i.max_amount)
              print('=== GAME_SETTING ===')
              gs = s.scalars(select(MstGameSetting)).first()
              print('recover_jewel_amount=', gs.recover_jewel_amount)
              print('recover_jewel_begin_date=', gs.recover_jewel_begin_date)
              print('recover_jewel_end_date=', gs.recover_jewel_end_date)
              print('=== USERS ===')
              for u in s.scalars(select(User).limit(3)).all():
                  print(str(u.user_id), 'vitality=', u.vitality, 'stored=', u._vitality, 'max=', u.max_vitality, 'full=', u.full_recover_date, 'interval=', u.auto_recover_interval, 'ticket=', u.live_ticket)
              print('=== JEWELS ===')
              for j in s.scalars(select(Jewel).limit(3)).all():
                  print(str(j.user_id), 'free=', j.free_jewel_amount, 'paid=', j.paid_jewel_amount)
          PY
      - name: Print ItemSchema implementation
        shell: bash
        run: |
          grep -RIn -A 55 -B 4 -E '^class ItemSchema\\b' mltd/models/schemas.py || true
