name: Analyze AppGuard callback installer
on:
  workflow_dispatch:
  push:
    branches: [client-zh-fixed-reconstruction]
    paths:
      - '.github/workflows/analyze-appguard-callback-installer.yml'
      - 'tools/client-source/analyze-appguard-callback-installer.py'
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - run: python -m pip install --disable-pip-version-check capstone pyelftools
      - name: Download exact official libcompatible
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk work/native
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 300 -A 'Mozilla/5.0' -o work/original.xapk \
            'https://d.apkpure.net/b/XAPK/com.bandainamcoent.imas_millionlive_theaterdays_ch?version=latest'
          test "$(sha1sum work/original.xapk|awk '{print $1}')" = '1b77ddd342a4020ba032ec63ae7ef9288551b6e7'
          unzip -q work/original.xapk -d work/xapk
          unzip -q work/xapk/config.arm64_v8a.apk 'lib/arm64-v8a/libcompatible.so' -d work/split
          cp work/split/lib/arm64-v8a/libcompatible.so work/native/libcompatible.so
          test "$(sha256sum work/native/libcompatible.so|awk '{print $1}')" = '8880c415e1ab82c31858be68ce12b76b95dc8ff8875b76c1246a8bc0679647bc'
      - name: Disassemble candidate
        run: |
          OUT=client/reconstruction/appguard-analysis/callback-installer
          rm -rf "$OUT"
          python tools/client-source/analyze-appguard-callback-installer.py --lib work/native/libcompatible.so --out "$OUT"
      - name: Commit evidence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/reconstruction/appguard-analysis/callback-installer
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'client: record AppGuard callback installer disassembly'
          git fetch origin client-zh-fixed-reconstruction
          git rebase origin/client-zh-fixed-reconstruction
          git push origin HEAD:client-zh-fixed-reconstruction
