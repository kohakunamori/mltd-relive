name: Publish complete zh-fixed decompilation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing mltd-relive-game-client-zh-fixed.apk (blank = latest)'
        required: false
        default: ''
        type: string
      publish_branch:
        description: 'Destination branch for the complete decompiled tree'
        required: false
        default: 'client-decompiled-zh-fixed-v1'
        type: string
  push:
    branches:
      - client-source-extraction
    paths:
      - '.github/workflows/publish-zh-fixed-decompiled.yml'
      - 'tools/client-source/**'
      - 'release/game-client.env'
      - 'client/baseline/zh-fixed-v1.json'

permissions:
  contents: write

concurrency:
  group: publish-zh-fixed-decompiled
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish complete decompiled client tree
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 6 for Il2CppDumper
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install extraction dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils curl file rsync unzip zip zstd

      - name: Resolve release and destination branch
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_BRANCH: ${{ inputs.publish_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          publish_branch="${REQUESTED_BRANCH:-client-decompiled-zh-fixed-v1}"
          if [[ ! "$publish_branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unsafe publish branch name: $publish_branch" >&2
            exit 2
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_ENV"
          echo "publish_branch=$publish_branch" >> "$GITHUB_ENV"
          echo "Using release: $release_tag"
          echo "Publishing to: $publish_branch"

      - name: Download fixed Traditional Chinese APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'mltd-relive-game-client-zh-fixed.apk' \
            --dir input
          test -s input/mltd-relive-game-client-zh-fixed.apk

      - name: Verify exact APK baseline
        shell: bash
        run: |
          set -euo pipefail
          source release/game-client.env
          echo "${ZH_SHA256}  input/mltd-relive-game-client-zh-fixed.apk" | sha256sum -c -

      - name: Generate Apktool and JADX trees
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/client-source/extract-zh-fixed.sh
          tools/client-source/extract-zh-fixed.sh \
            input/mltd-relive-game-client-zh-fixed.apk \
            "$RUNNER_TEMP/client-source-output"

      - name: Generate IL2CPP metadata tree
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/client-source/extract-il2cpp.sh
          tools/client-source/extract-il2cpp.sh "$RUNNER_TEMP/client-source-output"

      - name: Compare client RPC contract with server
        shell: bash
        run: |
          set -euo pipefail
          python tools/client-source/compare-server-contract.py \
            "$RUNNER_TEMP/client-source-output/report/client-rpc-methods.txt" \
            standalone/mltd/services \
            "$RUNNER_TEMP/client-source-output/report"

      - name: Prepare complete publish tree
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/client-source-output"
          dst="$RUNNER_TEMP/publish-tree"
          rm -rf "$dst"
          mkdir -p "$dst"
          rsync -a "$src/" "$dst/"

          # This APK is an output of the rebuild validation, not decompiler
          # source. Keeping it would add ~92 MiB without adding information.
          rm -rf "$dst/rebuild-check"

          python - "$dst" "$release_tag" "$GITHUB_SHA" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          release_tag = sys.argv[2]
          source_commit = sys.argv[3]
          limit = 100 * 1024 * 1024
          files = []
          total = 0
          too_large = []
          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              size = p.stat().st_size
              total += size
              rel = p.relative_to(root).as_posix()
              files.append((size, rel))
              if size >= limit:
                  too_large.append((size, rel))
          if too_large:
              for size, rel in too_large:
                  print(f'File exceeds GitHub regular Git limit: {size} {rel}', file=sys.stderr)
              raise SystemExit(1)

          apk_hash = (root / 'report' / 'APK_SHA256.txt').read_text(encoding='utf-8').split()[0]
          largest = sorted(files, reverse=True)[:20]
          provenance = {
              'baseline': 'zh-fixed-v1',
              'release_tag': release_tag,
              'source_maintenance_commit': source_commit,
              'apk_sha256': apk_hash,
              'file_count': len(files),
              'total_bytes': total,
              'largest_files': [{'path': rel, 'bytes': size} for size, rel in largest],
              'generated_by': '.github/workflows/publish-zh-fixed-decompiled.yml',
              'excluded_generated_output': ['rebuild-check/unsigned-rebuilt.apk'],
          }
          (root / 'PROVENANCE.json').write_text(
              json.dumps(provenance, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )

          readme = f'''# MLTD zh-fixed v1 — complete decompiled client tree

This branch is generated from the Traditional Chinese corrected client shipped in `{release_tag}`.
It is an **orphan generated branch**: it intentionally does not share history with `main` and is force-updated by CI so repeated regeneration does not accumulate hundreds of MiB of binary history.

## Baseline

- APK: `mltd-relive-game-client-zh-fixed.apk`
- SHA-256: `{apk_hash}`
- Maintenance source commit: `{source_commit}`
- Files in this generated tree: `{len(files)}`
- Total generated tree size: `{total / 1024 / 1024:.1f} MiB`

## Directory map

- `apktool/` — authoritative Android/Dalvik maintenance view: decoded manifest/resources + smali + exact native/assets payloads.
- `jadx/` — Java-like readability view. Useful for Android shell analysis; not a guaranteed recompilable Gradle project.
- `il2cpp-dump/` — Il2CppDumper output: `dump.cs`, `script.json`, `il2cpp.h`, `DummyDll/`, string literals and metadata-derived symbol maps.
- `raw-critical/` — exact binary AndroidManifest/resources copied from the APK for round-trip comparison.
- `report/` — tool versions, hashes, ELF/APK structure, network hits, RPC contract, server coverage and extraction logs.
- `PROVENANCE.json` — machine-readable origin, size and largest-file inventory.

The rebuild-check APK is deliberately omitted because it is a derived build product, not decompiled source. The maintenance workflow still verifies that Apktool can rebuild the decoded baseline.

## Source-of-truth hierarchy

1. For Android/Dalvik byte-level edits, prefer `apktool/` / smali.
2. For readability of Java Android shell logic, use `jadx/`.
3. For MLTD gameplay/network logic, use `il2cpp-dump/dump.cs` + RVA/offset data and the original `apktool/lib/arm64-v8a/libil2cpp.so`.
4. `dump.cs` contains recovered declarations/signatures and RVA/VA/offset annotations; it does **not** recreate original C# method bodies.

Full maintenance documentation lives on the `client-source-extraction` branch at `docs/CLIENT_DECOMPILATION_COMPLETE.md`.
'''
          (root / 'README.md').write_text(readme, encoding='utf-8')
          PY

          echo "Publish tree size:"
          du -sh "$dst"
          echo "Largest files:"
          find "$dst" -type f -printf '%s %p\n' | sort -nr | head -20

      - name: Publish orphan decompiled branch
        shell: bash
        run: |
          set -euo pipefail
          publish_root="$RUNNER_TEMP/publish-tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan __publish_zh_decompiled
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a "$publish_root/" ./
          git add -A
          git commit -m "client: publish complete zh-fixed decompilation (${release_tag})"
          git count-objects -vH
          git push --force origin "HEAD:refs/heads/${publish_branch}"

      - name: Verify published branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/branches/${publish_branch}" --jq '.name + " @ " + .commit.sha'
