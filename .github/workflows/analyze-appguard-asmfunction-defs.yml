name: Trace AppGuard asmFunction definitions

on:
  workflow_dispatch:
  push:
    branches:
      - client-zh-fixed-reconstruction
    paths:
      - '.github/workflows/analyze-appguard-asmfunction-defs.yml'
      - 'tools/client-source/trace-appguard-asmfunction-defs.py'
      - 'tools/client-source/trace-appguard-register-chain.py'
      - 'tools/client-source/analyze-appguard-trampoline-builder.py'
      - 'client/reconstruction/appguard-analysis/bootstrap-cfg.json'
      - 'client/reconstruction/appguard-analysis/asmfunction-init.json'

permissions:
  contents: write

jobs:
  trace-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trace definitions, provenance and trampoline builder
        shell: bash
        run: |
          set -euo pipefail
          python tools/client-source/trace-appguard-asmfunction-defs.py \
            --bootstrap client/reconstruction/appguard-analysis/bootstrap-cfg.json \
            --asm-init client/reconstruction/appguard-analysis/asmfunction-init.json \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/trace-appguard-register-chain.py \
            --bootstrap client/reconstruction/appguard-analysis/bootstrap-cfg.json \
            --out client/reconstruction/appguard-analysis
          python tools/client-source/analyze-appguard-trampoline-builder.py \
            --bootstrap client/reconstruction/appguard-analysis/bootstrap-cfg.json \
            --out client/reconstruction/appguard-analysis

      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/reconstruction/appguard-analysis/asmfunction-defs.json \
                  client/reconstruction/appguard-analysis/asmfunction-defs.md \
                  client/reconstruction/appguard-analysis/asmfunction-provenance.json \
                  client/reconstruction/appguard-analysis/asmfunction-provenance.md \
                  client/reconstruction/appguard-analysis/trampoline-builder.json \
                  client/reconstruction/appguard-analysis/trampoline-builder.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'client: analyze AppGuard RWX trampoline builder'
          git push origin HEAD:client-zh-fixed-reconstruction
