name: Test birthday present runtime

on:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: >-
          python -m pip install
          json-rpc==1.15.0
          SQLAlchemy==2.0.19 SQLAlchemy-Utils==0.41.1
          marshmallow==3.20.1 marshmallow-sqlalchemy==0.29.0
          msgpack==1.0.5 pycryptodome==3.18.0
      - name: Run birthday SQLAlchemy runtime coverage
        working-directory: standalone
        run: |
          PYTHONPATH=. python -m mltd.models.setup
          PYTHONPATH=. python ../tests/test_birthday_present_runtime.py
