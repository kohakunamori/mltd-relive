name: Test local asset and server transport

on:
  push:
    branches:
      - main
      - perf/asset-mirror
      - perf/local-assets-and-server
      - fix/live-asset-compat
    paths:
      - 'standalone/console.py'
      - 'standalone/gui.pyw'
      - 'standalone/main.py'
      - 'standalone/mltd/models/**'
      - 'standalone/mltd/services/**'
      - 'standalone/mltd/locales/**'
      - 'standalone/mltd/servers/api_server.py'
      - 'standalone/mltd/servers/asset_cache.py'
      - 'standalone/mltd/servers/asset_prepare.py'
      - 'standalone/mltd/servers/asset_server.py'
      - 'standalone/mltd/servers/config.py'
      - 'standalone/mltd/servers/dns.py'
      - 'standalone/mltd/servers/handler.py'
      - 'standalone/mltd/servers/proxy.py'
      - 'requirements.txt'
      - 'tools/prefetch_assets.py'
      - 'tools/verify_asset_mirror.py'
      - 'tests/test_asset_mirror.py'
      - 'tests/test_asset_prefetch_fastpath.py'
      - 'tests/test_asset_server_hotpath.py'
      - 'tests/test_asset_host_routing.py'
      - 'tests/test_local_asset_runtime.py'
      - 'tests/test_proxy_tls_compat.py'
      - 'tests/test_strict_local_and_api.py'
      - 'tests/api_transport_benchmark.py'
      - 'tests/asset_server_benchmark.py'
      - 'tests/remote_asset_compat.py'
      - '.github/workflows/test-asset-mirror.yml'
  pull_request:
    paths:
      - 'standalone/console.py'
      - 'standalone/gui.pyw'
      - 'standalone/main.py'
      - 'standalone/mltd/models/**'
      - 'standalone/mltd/services/**'
      - 'standalone/mltd/locales/**'
      - 'standalone/mltd/servers/api_server.py'
      - 'standalone/mltd/servers/asset_cache.py'
      - 'standalone/mltd/servers/asset_prepare.py'
      - 'standalone/mltd/servers/asset_server.py'
      - 'standalone/mltd/servers/config.py'
      - 'standalone/mltd/servers/dns.py'
      - 'standalone/mltd/servers/handler.py'
      - 'standalone/mltd/servers/proxy.py'
      - 'requirements.txt'
      - 'tools/prefetch_assets.py'
      - 'tools/verify_asset_mirror.py'
      - 'tests/test_asset_mirror.py'
      - 'tests/test_asset_prefetch_fastpath.py'
      - 'tests/test_asset_server_hotpath.py'
      - 'tests/test_asset_host_routing.py'
      - 'tests/test_local_asset_runtime.py'
      - 'tests/test_proxy_tls_compat.py'
      - 'tests/test_strict_local_and_api.py'
      - 'tests/api_transport_benchmark.py'
      - 'tests/asset_server_benchmark.py'
      - 'tests/remote_asset_compat.py'
      - '.github/workflows/test-asset-mirror.yml'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - name: Compile Python source
        run: |
          python -m compileall -q standalone/mltd/models standalone/mltd/services standalone/mltd/servers
          python -m py_compile \
            standalone/console.py \
            standalone/gui.pyw \
            standalone/main.py \
            tools/prefetch_assets.py \
            tools/verify_asset_mirror.py \
            tests/test_asset_mirror.py \
            tests/test_asset_prefetch_fastpath.py \
            tests/test_asset_server_hotpath.py \
            tests/test_asset_host_routing.py \
            tests/test_local_asset_runtime.py \
            tests/test_proxy_tls_compat.py \
            tests/test_strict_local_and_api.py \
            tests/api_transport_benchmark.py \
            tests/asset_server_benchmark.py \
            tests/remote_asset_compat.py
      - name: Run local asset and transport tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Benchmark API transport
        run: python tests/api_transport_benchmark.py
      - name: Benchmark asset serving
        run: python tests/asset_server_benchmark.py

  api-runtime:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API runtime dependencies
        run: >-
          python -m pip install
          requests==2.31.0
          msgpack==1.0.5
          json-rpc==1.15.0
          marshmallow==3.20.1
          marshmallow-sqlalchemy==0.29.0
          SQLAlchemy==2.0.19
          SQLAlchemy-Utils==0.41.1
          pycryptodome==3.18.0
      - name: Import complete API service graph and verify SQLite mode
        working-directory: standalone
        run: |
          python - <<'PY'
          from mltd.models.engine import engine
          from mltd.servers.handler import application
          from mltd.servers.proxy import ProxyHTTPRequestHandler

          assert callable(application)
          assert ProxyHTTPRequestHandler.protocol_version == 'HTTP/1.1'
          with engine.connect() as conn:
              journal = conn.exec_driver_sql('PRAGMA journal_mode').scalar_one()
              synchronous = conn.exec_driver_sql('PRAGMA synchronous').scalar_one()
              busy_timeout = conn.exec_driver_sql('PRAGMA busy_timeout').scalar_one()
          assert journal.lower() == 'wal', journal
          assert synchronous == 1, synchronous
          assert busy_timeout == 5000, busy_timeout
          print('API runtime import OK; SQLite WAL/NORMAL/busy_timeout active')
          PY

  remote-compat:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - name: Compare local mirror with live CDN manifests and assets
        run: python tests/remote_asset_compat.py
