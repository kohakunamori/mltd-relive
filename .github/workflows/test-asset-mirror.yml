name: Test asset mirror

on:
  push:
    branches:
      - perf/asset-mirror
  pull_request:
    paths:
      - 'standalone/mltd/servers/asset_cache.py'
      - 'standalone/mltd/servers/asset_server.py'
      - 'tools/prefetch_assets.py'
      - 'tools/verify_asset_mirror.py'
      - 'tests/test_asset_mirror.py'
      - '.github/workflows/test-asset-mirror.yml'

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - name: Compile asset mirror modules
        run: >-
          python -m py_compile
          standalone/mltd/servers/asset_cache.py
          standalone/mltd/servers/asset_server.py
          tools/prefetch_assets.py
          tools/verify_asset_mirror.py
          tests/test_asset_mirror.py
      - name: Run asset mirror tests
        run: python -m unittest discover -s tests -p 'test_asset_mirror.py' -v
