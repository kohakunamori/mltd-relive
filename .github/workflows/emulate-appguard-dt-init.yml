name: Emulate AppGuard DT_INIT

on:
  workflow_dispatch:
  push:
    branches:
      - client-zh-fixed-reconstruction
    paths:
      - '.github/workflows/emulate-appguard-dt-init.yml'
      - 'tools/client-source/emulate-appguard-dt-init.py'

permissions:
  contents: write

jobs:
  emulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install emulator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pyelftools unicorn

      - name: Download exact official arm64 split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/xapk work/native
          curl -L --fail --retry 3 --connect-timeout 20 --max-time 300 \
            -A 'Mozilla/5.0' \
            -o work/original.xapk \
            'https://d.apkpure.net/b/XAPK/com.bandainamcoent.imas_millionlive_theaterdays_ch?version=latest'
          test "$(sha1sum work/original.xapk | awk '{print $1}')" = '1b77ddd342a4020ba032ec63ae7ef9288551b6e7'
          unzip -q work/original.xapk -d work/xapk
          test "$(sha256sum work/xapk/config.arm64_v8a.apk | awk '{print $1}')" = '9932366bd357dc33701a6e7282d26ed67630db95486f596328aade8523032e46'
          unzip -p work/xapk/config.arm64_v8a.apk lib/arm64-v8a/libcompatible.so > work/native/libcompatible.so
          test "$(sha256sum work/native/libcompatible.so | awk '{print $1}')" = '8880c415e1ab82c31858be68ce12b76b95dc8ff8875b76c1246a8bc0679647bc'

      - name: Execute minimal DT_INIT harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client/reconstruction/appguard-analysis/emulation
          python tools/client-source/emulate-appguard-dt-init.py \
            --libcompatible work/native/libcompatible.so \
            --out client/reconstruction/appguard-analysis/emulation

      - name: Commit emulation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/reconstruction/appguard-analysis/emulation
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'client: capture AppGuard DT_INIT runtime trampoline state'
          git push origin HEAD:client-zh-fixed-reconstruction
