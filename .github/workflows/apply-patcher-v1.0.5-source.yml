name: Apply APK Patcher v1.0.5 source fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-patcher-v1.0.5-source.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply source transformation from validated patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-patcher-v1.0.5.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          script = script.split("\nworkflow = Path('.github/workflows/build-and-release.yml')", 1)[0]
          exec(compile(script, '<v1.0.5-source-transform>', 'exec'), {})
          PY
          python -m py_compile tools/apk-patcher/apk-patcher.pyw
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apk-patcher/apk-patcher.pyw
          git commit -m 'fix(apk-patcher): parse signer directly from APK v2 block'
          git push origin HEAD:main
