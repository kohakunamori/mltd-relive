name: Implement favorite costume persistence v2

on:
  push:
    branches: [fix/story-service-compat]
    paths: ['.github/workflows/implement-favorite-costume-v2.yml']

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/story-service-compat
          fetch-depth: 0
      - name: Reuse patch script and normalize generated test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/implement-favorite-costume.yml').read_text()
          start = workflow.index("          from pathlib import Path\n", workflow.index("python - <<'PY'"))
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<favorite-costume-patch>', 'exec'), {})
          test = Path('tests/test_favorite_costume_runtime.py')
          content = test.read_text()
          content = content.replace('\\\"', '"').replace('\\n', '\n')
          test.write_text(content)
          PY
          python -m compileall -q standalone/mltd tests/test_favorite_costume_runtime.py
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add standalone/mltd/models/models.py standalone/mltd/models/schemas.py standalone/mltd/models/setup.py standalone/mltd/services/idol.py tests/test_favorite_costume_runtime.py
          git commit -m 'fix: persist idol favorite costumes'
          git push origin HEAD:fix/story-service-compat
