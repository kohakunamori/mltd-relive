name: 按需验证

on:
  workflow_dispatch:
    inputs:
      ubuntu_gui:
        description: '同时验证 Ubuntu 打包、许可声明和图形界面启动（默认关闭）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-validation-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  regression:
    name: 服务器回归测试
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装测试依赖
        run: python -m pip install -r requirements.txt
      - name: 检查源码语法
        run: |
          python -m compileall -q standalone/mltd/models standalone/mltd/services standalone/mltd/servers
          python -m py_compile \
            standalone/console.py \
            standalone/gui.pyw \
            standalone/main.py \
            tools/cache_assets.py \
            tests/test_asset_cache_tool.py \
            tests/test_asset_host_routing.py \
            tests/test_proxy_tls_compat.py \
            tests/test_strict_local_and_api.py \
            tests/test_unit_sqlalchemy_compat.py \
            tests/api_transport_benchmark.py
      - name: 初始化测试数据库并记录外键基线
        run: |
          set -euo pipefail
          cd standalone
          rm -f mltd-relive.db config.ini fk-baseline.json
          PYTHONPATH=. python -m mltd.models.setup
          python - <<'PY'
          import json, sqlite3
          db = sqlite3.connect('mltd-relive.db')
          baseline = list(db.execute('PRAGMA foreign_key_check'))
          with open('fk-baseline.json', 'w') as f:
              json.dump(baseline, f)
          print(f'baseline FK violations: {len(baseline)}')
          PY
      - name: 运行全部回归测试
        working-directory: standalone
        run: |
          PYTHONPATH=. python -m unittest discover -s ../tests -p 'test_*.py' -v
      - name: 检查测试未新增外键问题
        run: |
          cd standalone
          python - <<'PY'
          import json, sqlite3
          with open('fk-baseline.json') as f:
              baseline = {tuple(v) for v in json.load(f)}
          db = sqlite3.connect('mltd-relive.db')
          current = set(db.execute('PRAGMA foreign_key_check'))
          added = current - baseline
          if added:
              raise SystemExit(f'new FK violations introduced: {sorted(added)[:20]}')
          print(f'foreign_key_check unchanged: {len(current)} historical violations, 0 added')
          PY
      - name: 验证接口加载与数据库运行参数
        working-directory: standalone
        run: |
          python - <<'PY'
          from mltd.models.engine import engine
          from mltd.servers.handler import application
          from mltd.servers.proxy import ProxyHTTPRequestHandler

          assert callable(application)
          assert ProxyHTTPRequestHandler.protocol_version == 'HTTP/1.1'
          with engine.connect() as conn:
              journal = conn.exec_driver_sql('PRAGMA journal_mode').scalar_one()
              synchronous = conn.exec_driver_sql('PRAGMA synchronous').scalar_one()
              busy_timeout = conn.exec_driver_sql('PRAGMA busy_timeout').scalar_one()
          assert journal.lower() == 'wal', journal
          assert synchronous == 1, synchronous
          assert busy_timeout == 5000, busy_timeout
          print('API runtime import OK; SQLite WAL/NORMAL/busy_timeout active')
          PY
      - name: 验证旧版数据库升级
        run: |
          set -euo pipefail
          cd standalone
          rm -f mltd-relive.db config.ini
          PYTHONPATH=. python -m mltd.models.setup
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('mltd-relive.db')
          before = db.execute("SELECT level, money, name FROM user WHERE user_id='ffffffffffffffffffffffffffffffff'").fetchone()
          if before is None:
              before = db.execute("SELECT level, money, name FROM user WHERE search_id='00000000'").fetchone()
          db.execute('DROP TABLE account_credential')
          db.execute("UPDATE server_version SET version='0.1.10'")
          db.commit()
          with open('migration-before.txt', 'w') as f:
              f.write(repr(before))
          PY
          PYTHONPATH=. python - <<'PY'
          from mltd.models.setup import upgrade_database
          upgrade_database()
          PY
          PYTHONPATH=. python - <<'PY'
          import ast, sqlite3
          from mltd.accounts import DEFAULT_USERNAME
          from mltd.servers.config import version as current_version
          db = sqlite3.connect('mltd-relive.db')
          version = db.execute('SELECT version FROM server_version').fetchone()[0]
          if version != current_version:
              raise SystemExit(f'unexpected migrated version: {version}')
          row = db.execute('SELECT username FROM account_credential WHERE username=?', (DEFAULT_USERNAME,)).fetchone()
          if row != (DEFAULT_USERNAME,):
              raise SystemExit('default credential missing after migration')
          after = db.execute("SELECT level, money, name FROM user WHERE search_id='00000000'").fetchone()
          before = ast.literal_eval(open('migration-before.txt').read())
          if after != before:
              raise SystemExit(f'default save changed during migration: {before!r} -> {after!r}')
          print(f'v0.1.10 -> v{current_version} migration preserved default save')
          PY

  ubuntu-gui:
    name: Ubuntu 打包与界面验证
    needs: regression
    if: inputs.ubuntu_gui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 验证打包与启动失败判定
        run: python -m unittest discover -s tests -p 'test_ubuntu_standalone_packaging.py' -v

      - name: 安装打包与图形界面依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libtk8.6 libtcl8.6 xvfb xauth
          python -m venv env
          source env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 构建 Ubuntu 程序
        shell: bash
        run: |
          set -euo pipefail
          cd standalone
          ../env/bin/pyinstaller gui_ubuntu.spec

      - name: 校验运行库与完整许可声明
        shell: bash
        run: |
          set -euo pipefail
          cd standalone
          ../env/bin/python - <<'PY'
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader

          archive = CArchiveReader('dist/mltd-relive-standalone')
          for library in ('libtk8.6.so', 'libtcl8.6.so'):
              assert library in archive.toc, f'Missing bundled library: {library}'
          filename = 'mltd-relive-standalone-ubuntu-NOTICES.txt'
          embedded = archive.extract(f'licenses/{filename}')
          assert embedded == (Path('dist') / filename).read_bytes()
          for package in ('libtk8.6', 'libtcl8.6'):
              original = (Path('/usr/share/doc') / package / 'copyright').read_bytes()
              assert original.strip() and original in embedded, f'Incomplete notice: {package}'
          print('Both shared libraries and complete package notices are bundled.')
          PY

      - name: 验证图形界面启动
        shell: bash
        run: bash tools/smoke-test-ubuntu-gui.sh standalone/dist/mltd-relive-standalone
