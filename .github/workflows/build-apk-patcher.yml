name: Build APK Patcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apk-patcher/**'
      - 'requirements.txt'
      - '.github/workflows/build-apk-patcher.yml'

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'one-shot signing fix v1.0.9') || contains(github.event.head_commit.message, 'fix v1.0.9 workflow condition')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace broken apksigner wrapper path with direct JAR backend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apk-patcher/apk-patcher.pyw')
          text = path.read_text(encoding='utf-8')

          marker = "def parse_apktool_version():\n"
          helper = r'''def apksigner_base_command():
    # Android Build Tools 29.0.3's Windows apksigner.bat can silently exit
    # without signing when the SDK's tools/lib/find_java.bat is missing.
    # Bypass the wrapper and invoke its real apksigner.jar directly.
    if apksigner_path.lower().endswith('.bat'):
        apksigner_jar = os.path.join(
            os.path.dirname(apksigner_path), 'lib', 'apksigner.jar'
        )
        if not os.path.isfile(apksigner_jar):
            raise RuntimeError(
                'apksigner.jar was not found next to apksigner.bat.\n\n'
                'Expected: ' + apksigner_jar + '\n\n'
                'Repair/reinstall Android SDK Build Tools or select a complete '
                'Build Tools installation.'
            )
        java_path = shutil.which('java.exe') or shutil.which('java')
        if not java_path:
            raise RuntimeError(
                'Java was not found in PATH. Java is required to execute '
                'apksigner.jar directly.'
            )
        return [java_path, '-jar', apksigner_jar]
    return [apksigner_path]


def run_apksigner(arguments, name):
    return run_command(apksigner_base_command() + list(arguments), name)


def validate_apksigner_verification_output(output):
    text = (output or '').strip()
    if not text:
        raise RuntimeError(
            'apksigner verification produced no output. Refusing to emit an APK '
            'because the signing tool may not have executed.'
        )

    v1 = re.search(
        r'Verified using v1 scheme \(JAR signing\):\s*(true|false)',
        text, re.IGNORECASE
    )
    v2 = re.search(
        r'Verified using v2 scheme \(APK Signature Scheme v2\):\s*(true|false)',
        text, re.IGNORECASE
    )
    signers = re.search(r'Number of signers:\s*(\d+)', text, re.IGNORECASE)

    if not v1 or v1.group(1).lower() != 'true':
        raise RuntimeError(
            'Final APK did not verify with the v1/JAR signature scheme.\n\n' + text
        )
    if not v2 or v2.group(1).lower() != 'true':
        raise RuntimeError(
            'Final APK did not verify with APK Signature Scheme v2.\n\n' + text
        )
    if not signers or int(signers.group(1)) < 1:
        raise RuntimeError(
            'apksigner reported no APK signers.\n\n' + text
        )


'''
          if 'def apksigner_base_command():' not in text:
              text = text.replace(marker, helper + marker, 1)

          old_validate = """    if not os.path.isfile(apksigner_path):
        return 'Invalid apksigner Path'
    if not apksigner_path.endswith('apksigner.bat') and not apksigner_path.endswith('apksigner'):
        return 'Invalid apksigner.bat Path'
    if not os.path.isfile(apk_path) or not apk_path.lower().endswith('.apk'):
"""
          new_validate = """    if not os.path.isfile(apksigner_path):
        return 'Invalid apksigner Path'
    if not apksigner_path.endswith('apksigner.bat') and not apksigner_path.endswith('apksigner'):
        return 'Invalid apksigner.bat Path'
    try:
        signer_probe = run_command(
            apksigner_base_command() + ['version'],
            'apksigner direct backend check'
        )
        if not (signer_probe.stdout or '').strip():
            return 'apksigner direct backend produced no output'
    except Exception as exc:
        return str(exc)
    if not os.path.isfile(apk_path) or not apk_path.lower().endswith('.apk'):
"""
          if old_validate not in text:
              raise SystemExit('validate_input apksigner block not found')
          text = text.replace(old_validate, new_validate, 1)

          old_extract = """def extract_signer_sha256(apk_filename, verify=True):
    if verify:
        # Some old Build Tools versions (notably 29.0.3 on Windows)
        # return success here but emit no --print-certs/--verbose text.
        # Treat apksigner's exit code as the cryptographic verdict and
        # read the actual signer certificate from the APK v2 block.
        run_command([
            apksigner_path, 'verify',
            '--min-sdk-version', '19',
            apk_filename
        ], 'apksigner certificate verification')

    return _extract_v2_signer_certificate_sha256(apk_filename)
"""
          new_extract = """def extract_signer_sha256(apk_filename, verify=True):
    if verify:
        result = run_apksigner([
            'verify',
            '--verbose',
            '--print-certs',
            '--min-sdk-version', '19',
            apk_filename
        ], 'apksigner certificate verification')
        validate_apksigner_verification_output(result.stdout)

    return _extract_v2_signer_certificate_sha256(apk_filename)
"""
          if old_extract not in text:
              raise SystemExit('extract_signer_sha256 block not found')
          text = text.replace(old_extract, new_extract, 1)

          start = text.index('def apksigner():\n')
          end = text.index('\n\ndef collect_output():', start)
          new_signer = r'''def apksigner():
    output_apk = patched_apk_path()

    run_apksigner([
        'sign',
        '--ks', os.path.join(current_path(), 'mltd.jks'),
        '--ks-type', 'PKCS12',
        '--ks-key-alias', 'bndltool',
        '--ks-pass', 'pass:changeit',
        '--key-pass', 'pass:changeit',
        '--min-sdk-version', '19',
        '--v1-signing-enabled', 'true',
        '--v2-signing-enabled', 'true',
        output_apk
    ], 'apksigner sign (direct JAR backend)')

    verify_result = run_apksigner([
        'verify',
        '--verbose',
        '--print-certs',
        '--min-sdk-version', '19',
        output_apk
    ], 'apksigner verify (direct JAR backend)')
    validate_apksigner_verification_output(verify_result.stdout)

    # v2 is now mandatory. Compare the actual certificate embedded in the
    # generated APK against the original corrected client's signer.
    final_signer_sha256 = extract_signer_sha256(output_apk, verify=False)
    if final_signer_sha256 != original_signer_sha256:
        raise RuntimeError(
            'Final APK signer does not match the input APK signer.\n\n'
            f'Input signer SHA-256: {original_signer_sha256}\n'
            f'Output signer SHA-256: {final_signer_sha256}'
        )

    validate_payload_changes(output_apk)
'''
          text = text[:start] + new_signer + text[end:]

          path.write_text(text, encoding='utf-8')
          Path('tools/apk-patcher/VERSION').write_text('1.0.9\n', encoding='utf-8')
          PY
          python -m py_compile tools/apk-patcher/apk-patcher.pyw
          git diff --check
      - name: Commit v1.0.9 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apk-patcher/apk-patcher.pyw tools/apk-patcher/VERSION
          git commit -m 'fix(apk-patcher): bypass broken Windows apksigner wrapper'
          git push origin HEAD:main

  build:
    needs: apply
    name: Build packages
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: Windows
            cmd-install: |
              python -m venv env
              .\env\Scripts\activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd tools\apk-patcher
              ..\..\env\Scripts\pyinstaller apk-patcher_windows.spec
            package-source: tools/apk-patcher/dist/mltd-relive-apk-patcher.exe
            package-name: mltd-relive-apk-patcher-v1.0.9-windows.exe
            out-name: patcher-windows
          - os: ubuntu-latest
            target: Ubuntu
            cmd-install: |
              python -m venv env
              source env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd tools/apk-patcher
              ../../env/bin/pyinstaller apk-patcher_ubuntu.spec
            package-source: tools/apk-patcher/dist/mltd-relive-apk-patcher
            package-name: mltd-relive-apk-patcher-v1.0.9-ubuntu
            out-name: patcher-ubuntu
          - os: macos-latest
            target: macOS
            cmd-install: |
              python -m venv env
              source env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            cmd-build: |
              cd tools/apk-patcher
              ../../env/bin/pyinstaller apk-patcher_macos.spec
              cd dist
              zip -r9 mltd-relive-apk-patcher-v1.0.9-macos.zip mltd-relive-apk-patcher.app
            package-source: tools/apk-patcher/dist/mltd-relive-apk-patcher-v1.0.9-macos.zip
            package-name: mltd-relive-apk-patcher-v1.0.9-macos.zip
            out-name: patcher-macos
    steps:
      - name: Checkout patched main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm one-shot signing fix
        shell: bash
        run: |
          grep -qx '1.0.9' tools/apk-patcher/VERSION
          grep -q "'-jar', apksigner_jar" tools/apk-patcher/apk-patcher.pyw
          grep -q 'validate_apksigner_verification_output' tools/apk-patcher/apk-patcher.pyw
          python -m py_compile tools/apk-patcher/apk-patcher.pyw
      - name: Install dependencies for ${{ matrix.target }}
        run: ${{ matrix.cmd-install }}
      - name: Build with PyInstaller for ${{ matrix.target }}
        run: ${{ matrix.cmd-build }}
      - name: Stage release file
        shell: bash
        env:
          SOURCE: ${{ matrix.package-source }}
          NAME: ${{ matrix.package-name }}
        run: |
          mkdir -p release-output
          cp "$SOURCE" "release-output/$NAME"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out-name }}
          path: release-output/*
          if-no-files-found: error

  publish:
    needs: build
    name: Publish v1.0.9
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Replace APK Patcher assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: standalone-v0.1.3
        shell: bash
        run: |
          set -euo pipefail
          for name in $(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^mltd-relive-apk-patcher-v' || true); do
            gh release delete-asset "$RELEASE_TAG" "$name" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release upload "$RELEASE_TAG" artifacts/patcher-windows/* artifacts/patcher-ubuntu/* artifacts/patcher-macos/* --repo "$GITHUB_REPOSITORY" --clobber
