name: Audit birthday native reward path

on:
  push:
    branches: [fix/story-service-compat]
    paths: ['.github/workflows/audit-birthday-native.yml']

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Disassemble birthday request and reward paths
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:apktool/lib/arm64-v8a/libil2cpp.so > /tmp/libil2cpp.so
          if command -v aarch64-linux-gnu-objdump >/dev/null 2>&1; then
            OBJDUMP=aarch64-linux-gnu-objdump
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq binutils-aarch64-linux-gnu
            OBJDUMP=aarch64-linux-gnu-objdump
          fi
          {
            file /tmp/libil2cpp.so
            readelf -l /tmp/libil2cpp.so | head -80
            echo "OBJDUMP=$OBJDUMP"
            echo '===== OnClickPresentButton 0x240d35c ====='
            "$OBJDUMP" -D --start-address=0x240d35c --stop-address=0x240d448 /tmp/libil2cpp.so
            echo '===== ProcessReward iterator MoveNext 0x189970c ====='
            "$OBJDUMP" -D --start-address=0x189970c --stop-address=0x1899dbc /tmp/libil2cpp.so
            echo '===== Mission popup iterator 0x1899458 ====='
            "$OBJDUMP" -D --start-address=0x1899458 --stop-address=0x189966c /tmp/libil2cpp.so
          } > /tmp/birthday-native.txt 2>&1
          cat /tmp/birthday-native.txt
      - uses: actions/upload-artifact@v4
        with:
          name: birthday-native-disassembly
          path: /tmp/birthday-native.txt
          retention-days: 7
