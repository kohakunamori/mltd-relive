name: Audit user-owned schema

on:
  push:
    branches:
      - feature/multi-user-accounts
    paths:
      - '.github/workflows/audit-user-schema.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install -r requirements.txt >/dev/null
          cd standalone
          python - <<'PY'
          from mltd.models.models import Base
          for name, table in sorted(Base.metadata.tables.items()):
              cols = {c.name for c in table.columns}
              if 'user_id' not in cols and name not in {'user', 'profile'}:
                  continue
              pk = [c.name for c in table.primary_key.columns]
              fks = [(c.name, [str(f.column) for f in c.foreign_keys]) for c in table.columns if c.foreign_keys]
              print(f'{name}: pk={pk}')
              print('  cols=' + ','.join(c.name for c in table.columns))
              print('  fks=' + repr(fks))
          PY
