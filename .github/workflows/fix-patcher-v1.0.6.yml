name: Fix APK Patcher v1.0.6 signer parsing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-patcher-v1.0.6.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Relax v2 SignedData tail parsing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apk-patcher/apk-patcher.pyw')
          text = p.read_text(encoding='utf-8')
          old = '''    _, signed_offset = _read_length_prefixed(signed_data, 0)\n    certificates, signed_offset = _read_length_prefixed(\n        signed_data, signed_offset\n    )\n    _, signed_offset = _read_length_prefixed(signed_data, signed_offset)\n    if signed_offset != len(signed_data):\n        raise RuntimeError('Malformed APK v2 signed-data record.')\n\n    certificate, _ = _read_length_prefixed(certificates, 0)\n'''
          new = '''    # apksigner already performs the full cryptographic/structural verify.\n    # For signer identity comparison we only need the certificate sequence,\n    # which is the second length-prefixed field in v2 SignedData. Some legacy\n    # APKs append reserved/extension bytes after the normal v2 fields.\n    _, signed_offset = _read_length_prefixed(signed_data, 0)\n    certificates, _ = _read_length_prefixed(signed_data, signed_offset)\n\n    certificate, _ = _read_length_prefixed(certificates, 0)\n'''
          if old not in text:
              raise SystemExit('expected strict SignedData block was not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tools/apk-patcher/apk-patcher.pyw

      - name: Download known corrected Traditional Chinese client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download standalone-v0.1.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'mltd-relive-game-client-zh-fixed.apk' \
            --dir /tmp/mltd-client

      - name: Exercise actual binary v2 parser against known client
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source_path = Path('tools/apk-patcher/apk-patcher.pyw')
          tree = ast.parse(source_path.read_text(encoding='utf-8'))
          wanted_functions = {
              '_read_length_prefixed',
              '_extract_apk_v2_block',
              '_extract_v2_signer_certificate_sha256',
          }
          nodes = []
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  names = {t.id for t in node.targets if isinstance(t, ast.Name)}
                  if names & {'APK_SIG_BLOCK_MAGIC', 'APK_SIGNATURE_SCHEME_V2_ID'}:
                      nodes.append(node)
              elif isinstance(node, ast.FunctionDef) and node.name in wanted_functions:
                  nodes.append(node)

          module = ast.Module(body=nodes, type_ignores=[])
          ns = {}
          exec('import hashlib\nimport os\nimport struct\n', ns)
          exec(compile(module, str(source_path), 'exec'), ns)

          apk = '/tmp/mltd-client/mltd-relive-game-client-zh-fixed.apk'
          digest = ns['_extract_v2_signer_certificate_sha256'](apk)
          expected = '97a2df3b955591658932ef98db1bb412223b6efcda58c4ada79901036e93d91f'
          print('signer sha256:', digest)
          if digest != expected:
              raise SystemExit(f'unexpected signer digest: {digest}')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apk-patcher/apk-patcher.pyw
          git commit -m 'fix(apk-patcher): tolerate legacy v2 SignedData extensions'
          git push origin HEAD:main
