name: Audit indirect user-owned tables

on:
  push:
    branches:
      - feature/multi-user-accounts
    paths:
      - '.github/workflows/audit-user-ownership-graph.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt >/dev/null
      - name: Print user ownership graph
        run: |
          cd standalone
          python - <<'PY'
          from mltd.models.models import Base

          tables = Base.metadata.tables
          owned = {'user'}
          reasons = {'user': 'root'}
          changed = True
          while changed:
              changed = False
              for name, table in tables.items():
                  if name in owned or name.startswith('mst_') or name == 'server_version':
                      continue
                  for fk in table.foreign_key_constraints:
                      target = fk.referred_table.name
                      if target in owned:
                          owned.add(name)
                          reasons[name] = f'FK -> {target}: ' + ','.join(
                              f'{e.parent.name}->{e.column.name}' for e in fk.elements
                          )
                          changed = True
                          break

          def direct(name):
              table=tables[name]
              if 'user_id' in table.c and any(
                  f.target_fullname == 'user.user_id'
                  for f in table.c.user_id.foreign_keys
              ):
                  return True
              if 'id_' in table.c and any(
                  f.target_fullname in {'user.user_id','profile.id_'}
                  for f in table.c.id_.foreign_keys
              ):
                  return True
              return False

          print('=== indirect user-owned tables ===')
          for name in sorted(owned):
              if name == 'user' or direct(name):
                  continue
              print(name, reasons.get(name, ''))
              table=tables[name]
              print('  pk=', [c.name for c in table.primary_key.columns])
              for fk in table.foreign_key_constraints:
                  print('  fk=', [(e.parent.name, e.column.table.name, e.column.name) for e in fk.elements])
          PY
