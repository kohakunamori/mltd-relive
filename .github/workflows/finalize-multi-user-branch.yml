name: Finalize multi-user branch

on:
  push:
    branches:
      - feature/multi-user-accounts
    paths:
      - '.github/workflows/finalize-multi-user-branch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update documentation and long-lived CI
        run: python tools/finalize_multi_user_branch.py
      - name: Remove temporary helpers
        run: |
          rm -f \
            .github/workflows/apply-multi-user-patch.yml \
            .github/workflows/audit-auth-client.yml \
            .github/workflows/audit-user-schema.yml \
            .github/workflows/audit-user-ownership-graph.yml \
            .github/workflows/finalize-multi-user-branch.yml \
            tools/finalize_multi_user_branch.py
      - name: Commit finalized branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: document multi-user accounts and finalize CI'
          git push origin HEAD:feature/multi-user-accounts
