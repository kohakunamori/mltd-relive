name: Finalize multi-user branch

on:
  push:
    branches:
      - feature/multi-user-accounts
    paths:
      - '.github/workflows/finalize-multi-user-branch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update README and handoff
        run: |
          python - <<'PY'
          from tools.finalize_multi_user_branch import update_readme, update_handoff
          update_readme()
          update_handoff()
          PY
      - name: Commit documentation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/SERVER_COMPAT_AGENT_HANDOFF.md
          git diff --cached --check
          git commit -m 'docs: document multi-user accounts'
          git push origin HEAD:feature/multi-user-accounts
