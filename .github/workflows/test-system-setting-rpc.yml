name: Test system setting RPC compatibility

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - 'standalone/mltd/services/__init__.py'
      - 'standalone/mltd/services/system_setting.py'
      - 'tests/test_system_setting_runtime.py'
      - '.github/workflows/test-system-setting-rpc.yml'
  pull_request:
    paths:
      - 'standalone/mltd/services/__init__.py'
      - 'standalone/mltd/services/system_setting.py'
      - 'tests/test_system_setting_runtime.py'
      - '.github/workflows/test-system-setting-rpc.yml'

jobs:
  runtime-system-setting:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: >-
          python -m pip install
          json-rpc==1.15.0
          SQLAlchemy==2.0.19 SQLAlchemy-Utils==0.41.1
          marshmallow==3.20.1 marshmallow-sqlalchemy==0.29.0
          msgpack==1.0.5 pycryptodome==3.18.0
      - name: Import system setting service
        working-directory: standalone
        run: >-
          python -c "import mltd.services.system_setting; print('System setting RPC import OK')"
      - name: Initialize standalone database
        working-directory: standalone
        run: python -c "from mltd.models.setup import setup; setup()"
      - name: Exercise persisted system setting mutation
        working-directory: standalone
        run: PYTHONPATH=. python ../tests/test_system_setting_runtime.py
