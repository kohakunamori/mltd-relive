name: Audit client auth contract

on:
  push:
    branches:
      - feature/multi-user-accounts
    paths:
      - '.github/workflows/audit-auth-client.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          git worktree add ../client-reverse client-decompiled-zh-fixed-v1
          cd ../client-reverse
          python - <<'PY'
          from pathlib import Path
          p = Path('il2cpp-dump/dump.cs')
          text = p.read_text(encoding='utf-8', errors='ignore')
          needles = [
              'TransferPasswordArgs', 'TransferPasswordReply', 'AuthService.TransferPassword',
              'LoginArgs', 'LoginReply', 'AuthService.Login',
              'X-Application-User-Id', 'Application-User', 'Authorization',
              'X-Application-Token', 'X-Auth', 'Bearer', 'token', 'secret',
          ]
          lines = text.splitlines()
          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle.lower() in line.lower()]
              print(f'\n===== {needle} hits={len(hits)} =====')
              for i in hits[:20]:
                  lo=max(0,i-8); hi=min(len(lines),i+18)
                  print(f'--- lines {lo+1}-{hi} ---')
                  print('\n'.join(lines[lo:hi]))
          PY
