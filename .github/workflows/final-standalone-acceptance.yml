name: Final standalone acceptance

on:
  push:
    branches:
      - feature/multi-user-accounts
    paths:
      - '.github/workflows/final-standalone-acceptance.yml'
  workflow_dispatch:

jobs:
  runtime:
    name: Full standalone runtime suite
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build fresh standalone database
        working-directory: standalone
        run: |
          rm -f mltd-relive.db mltd-relive.db-shm mltd-relive.db-wal config.ini
          PYTHONPATH=. python -m mltd.models.setup
      - name: Run complete test suite
        working-directory: standalone
        run: PYTHONPATH=. python -m unittest discover -s ../tests -p 'test_*.py' -v

  multi-user-migration:
    name: Multi-user migration and FK regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fresh DB and user registration FK baseline
        working-directory: standalone
        run: |
          set -euo pipefail
          rm -f mltd-relive.db config.ini fk-baseline.json
          PYTHONPATH=. python -m mltd.models.setup
          python - <<'PY'
          import json
          import sqlite3
          db = sqlite3.connect('mltd-relive.db')
          baseline = list(db.execute('PRAGMA foreign_key_check'))
          with open('fk-baseline.json', 'w') as f:
              json.dump(baseline, f)
          print(f'baseline FK violations: {len(baseline)}')
          PY
          PYTHONPATH=. python -m unittest discover -v -s ../tests -p 'test_multi_user_accounts_runtime.py'
          python - <<'PY'
          import json
          import sqlite3
          with open('fk-baseline.json') as f:
              baseline = {tuple(v) for v in json.load(f)}
          db = sqlite3.connect('mltd-relive.db')
          current = set(db.execute('PRAGMA foreign_key_check'))
          added = current - baseline
          if added:
              raise SystemExit(f'new FK violations introduced: {sorted(added)[:20]}')
          print(f'foreign_key_check unchanged: {len(current)} historical violations, 0 added')
          PY
      - name: Simulate v0.1.10 to v0.1.11 migration
        working-directory: standalone
        run: |
          set -euo pipefail
          rm -f mltd-relive.db config.ini migration-before.txt
          PYTHONPATH=. python -m mltd.models.setup
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect('mltd-relive.db')
          before = db.execute("SELECT level, money, name FROM user WHERE search_id='00000000'").fetchone()
          if before is None:
              raise SystemExit('default full-save user missing before migration')
          db.execute('DROP TABLE account_credential')
          db.execute("UPDATE server_version SET version='0.1.10'")
          db.commit()
          with open('migration-before.txt', 'w') as f:
              f.write(repr(before))
          PY
          PYTHONPATH=. python - <<'PY'
          from mltd.models.setup import upgrade_database
          upgrade_database()
          PY
          PYTHONPATH=. python - <<'PY'
          import ast
          import sqlite3
          from mltd.accounts import DEFAULT_USERNAME
          db = sqlite3.connect('mltd-relive.db')
          version = db.execute('SELECT version FROM server_version').fetchone()[0]
          if version != '0.1.11':
              raise SystemExit(f'unexpected migrated version: {version}')
          row = db.execute('SELECT username FROM account_credential WHERE username=?', (DEFAULT_USERNAME,)).fetchone()
          if row != (DEFAULT_USERNAME,):
              raise SystemExit('default credential missing after migration')
          after = db.execute("SELECT level, money, name FROM user WHERE search_id='00000000'").fetchone()
          before = ast.literal_eval(open('migration-before.txt').read())
          if after != before:
              raise SystemExit(f'default save changed during migration: {before!r} -> {after!r}')
          print('v0.1.10 -> v0.1.11 migration preserved default save')
          PY

  rpc-audit:
    name: Current client/server RPC audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Generate current coverage report
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          grep -oE '[A-Za-z][A-Za-z0-9]*Service\.[A-Za-z][A-Za-z0-9]*' /tmp/dump.cs | sort -u > /tmp/client-rpc.txt
          grep -RhoE "name=['\"][A-Za-z][A-Za-z0-9]*Service\.[A-Za-z][A-Za-z0-9]*['\"]" standalone/mltd/services \
            | sed -E "s/^name=['\"]//; s/['\"]$//" | sort -u > /tmp/server-rpc.txt
          {
            echo "HEAD=${GITHUB_SHA}"
            echo "client_rpc_count=$(wc -l < /tmp/client-rpc.txt)"
            echo "server_rpc_count=$(wc -l < /tmp/server-rpc.txt)"
            echo "missing_string_surface_count=$(comm -23 /tmp/client-rpc.txt /tmp/server-rpc.txt | wc -l)"
            echo
            echo '=== CLOSED REMAINING TARGETS ==='
            for rpc in \
              ItemService.UseItem \
              BirthdayService.ExecuteBirthdayPresent \
              IdolService.SetFavoriteCostume \
              IdolService.GetSalesCostumeList \
              PresentService.GetPresentHistory; do
              if grep -Fxq "$rpc" /tmp/server-rpc.txt; then state=registered; else state=not-registered; fi
              printf '%s\t%s\n' "$rpc" "$state"
            done
          } | tee /tmp/current-rpc-coverage.txt
      - uses: actions/upload-artifact@v4
        with:
          name: current-rpc-coverage
          path: /tmp/current-rpc-coverage.txt
          if-no-files-found: error
          retention-days: 14

  ubuntu-gui:
    name: Build latest Ubuntu standalone GUI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build dependencies
        run: |
          python -m venv env
          source env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build Ubuntu GUI
        run: |
          cd standalone
          ../env/bin/pyinstaller gui_ubuntu.spec
      - name: Verify executable
        run: |
          test -x standalone/dist/mltd-relive-standalone
          file standalone/dist/mltd-relive-standalone
          sha256sum standalone/dist/mltd-relive-standalone | tee standalone/dist/mltd-relive-standalone.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mltd-relive-final-ubuntu-${{ github.sha }}
          path: |
            standalone/dist/mltd-relive-standalone
            standalone/dist/mltd-relive-standalone.sha256
          if-no-files-found: error
          retention-days: 14
