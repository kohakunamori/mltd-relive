name: Audit current RPC coverage

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-current-rpc-coverage.yml'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Inspect birthday and theater completion contracts
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          echo '=== BIRTHDAY API / DTO REFERENCES ==='
          grep -n -C 18 -E 'ExecuteBirthdayPresent|class BirthdayStatus\b|class ResultIdol\b' /tmp/dump.cs | head -n 1400 || true
          echo '=== THEATER OPENING DTO ==='
          grep -n -C 18 -E 'class (FinishTheaterOpeningArgs|FinishTheaterOpeningReply|TheaterOpeningStatus)\b' /tmp/dump.cs || true
          echo '=== BIRTHDAY SERVER REFERENCES ==='
          grep -RIn -C 12 -E 'Birthday\(|BirthdayStatus|is_executed|birthday present|birthday.*present|Present\(' standalone/mltd | head -n 1200 || true
