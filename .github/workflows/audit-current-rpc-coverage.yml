name: Audit current RPC coverage

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-current-rpc-coverage.yml'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Inspect profile RPC contracts
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          echo '=== USER PROFILE RPC / DTO REFERENCES ==='
          grep -n -C 20 -E 'class (GetProfileArgs|GetProfileReply|SetSelfProfileArgs|SetSelfProfileReply|ProfileStatus|UserProfileStatus)\b|HTTPRequest (GetProfile|SetSelfProfile)\(' /tmp/dump.cs | head -n 1800 || true
          echo '=== PROFILE CLIENT USAGE ==='
          grep -n -C 14 -E 'GetProfile\(|SetSelfProfile\(|GetProfileReply|SetSelfProfileReply' /tmp/dump.cs | head -n 1800 || true
          echo '=== PROFILE SERVER MODELS/SCHEMAS ==='
          grep -n -C 24 -E '^class Profile\b|^class ProfileSchema\b' standalone/mltd/models/models.py standalone/mltd/models/schemas.py || true
