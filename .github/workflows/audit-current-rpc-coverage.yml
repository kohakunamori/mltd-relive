name: Audit current RPC coverage

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-current-rpc-coverage.yml'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Inspect corrected-client CostumeService contract
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          echo '=== COSTUME CLIENT REFERENCES ==='
          grep -n -C 10 -E 'GetCostumeList|SetCostume|CreateRequestAndSend<[^>]*Costume|GetReply<[^>]*Costume|HTTPRequest [A-Za-z0-9_]*Costume|CostumeStatus\[\]' /tmp/dump.cs | head -n 1800 || true
          echo '=== COSTUME SERVER MODELS ==='
          grep -n -C 22 -E '^class (Costume|MstCostume)\b|^class .*Costume.*Schema\b' standalone/mltd/models/models.py standalone/mltd/models/schemas.py || true
