name: Audit current RPC coverage

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-current-rpc-coverage.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Compare client RPC names with server registrations
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs

          grep -oE '[A-Za-z][A-Za-z0-9]*Service\.[A-Za-z][A-Za-z0-9]*' /tmp/dump.cs \
            | sort -u > /tmp/client-rpc.txt

          grep -RhoE "name=['\"][A-Za-z][A-Za-z0-9]*Service\.[A-Za-z][A-Za-z0-9]*['\"]" \
            standalone/mltd/services \
            | sed -E "s/^name=['\"]//; s/['\"]$//" \
            | sort -u > /tmp/server-rpc.txt

          echo '=== COUNTS ==='
          printf 'client=%s\n' "$(wc -l < /tmp/client-rpc.txt)"
          printf 'server=%s\n' "$(wc -l < /tmp/server-rpc.txt)"
          printf 'missing=%s\n' "$(comm -23 /tmp/client-rpc.txt /tmp/server-rpc.txt | wc -l)"

          echo '=== CLIENT RPC MISSING ON SERVER ==='
          comm -23 /tmp/client-rpc.txt /tmp/server-rpc.txt

          echo '=== SERVER RPC NOT SEEN IN CLIENT DUMP ==='
          comm -13 /tmp/client-rpc.txt /tmp/server-rpc.txt
