name: Audit current RPC coverage

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-current-rpc-coverage.yml'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Inspect exact profile contracts and call construction
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          echo '=== EXACT GetProfileReply ==='
          sed -n '629052,629145p' /tmp/dump.cs
          echo '=== EXACT SetSelfProfile DTO ==='
          sed -n '635580,635620p' /tmp/dump.cs
          echo '=== GetProfileArgs assignments / construction ==='
          grep -n -C 18 -E '(user_id|search_user_id|name_card_url|from_page) = .*|new GetProfileArgs|GetProfileArgs args' /tmp/dump.cs | head -n 1800 || true
          echo '=== SetSelfProfileArgs assignments ==='
          grep -n -C 16 -E 'SetSelfProfileArgs args|new SetSelfProfileArgs|helper_card_id_list =|mst_achievement_id_list =' /tmp/dump.cs | head -n 2200 || true
