name: Test lightweight client compatibility RPCs

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - 'standalone/mltd/services/__init__.py'
      - 'standalone/mltd/services/client_compat.py'
      - 'tests/test_client_compat_runtime.py'
      - '.github/workflows/test-client-compat-rpc.yml'
  pull_request:
    paths:
      - 'standalone/mltd/services/__init__.py'
      - 'standalone/mltd/services/client_compat.py'
      - 'tests/test_client_compat_runtime.py'
      - '.github/workflows/test-client-compat-rpc.yml'

jobs:
  runtime-client-compat:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: >-
          python -m pip install
          json-rpc==1.15.0
          SQLAlchemy==2.0.19 SQLAlchemy-Utils==0.41.1
          marshmallow==3.20.1 marshmallow-sqlalchemy==0.29.0
          msgpack==1.0.5 pycryptodome==3.18.0
      - name: Import compatibility RPCs
        working-directory: standalone
        run: >-
          python -c "import mltd.services.client_compat; print('Client compatibility RPC import OK')"
      - name: Exercise exact compatibility contracts
        working-directory: standalone
        run: PYTHONPATH=. python ../tests/test_client_compat_runtime.py
