name: Fix and Publish APK Patcher v1.0.8

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RELEASE_TAG: standalone-v0.1.3

jobs:
  apply:
    if: github.event.head_commit.message == 'ci: fix and publish apk-patcher v1.0.8'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Allow verified v1-only output from legacy Build Tools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apk-patcher/apk-patcher.pyw')
          text = path.read_text(encoding='utf-8')
          old = '''    # apksigner verify above is the authoritative signature verdict for
    # Android API 19+. Parse v2 only to compare signer identity without
    # depending on apksigner's human-readable output.
    final_signer_sha256 = extract_signer_sha256(
        output_apk, verify=False
    )
    if final_signer_sha256 != original_signer_sha256:
        raise RuntimeError(
            'Final APK signer does not match the input APK signer.\\n\\n'
            f'Input signer SHA-256: {original_signer_sha256}\\n'
            f'Output signer SHA-256: {final_signer_sha256}'
        )
'''
          new = '''    # apksigner verify above is the authoritative signature verdict for
    # Android API 19+. Old Build Tools such as 29.0.3 may successfully produce
    # a verifier-approved v1/JAR-signed APK without an APK Signature Scheme v2
    # block even when v2 signing was requested. If a v2 block exists, compare
    # its signer identity with the input APK. If it does not exist, trust the
    # successful apksigner verification plus the explicitly selected bundled
    # signing key instead of rejecting an otherwise valid legacy APK.
    final_signer_sha256 = None
    try:
        final_signer_sha256 = extract_signer_sha256(
            output_apk, verify=False
        )
    except RuntimeError as exc:
        if 'APK Signature Scheme v2 block was not found' not in str(exc):
            raise

    if (
        final_signer_sha256 is not None
        and final_signer_sha256 != original_signer_sha256
    ):
        raise RuntimeError(
            'Final APK signer does not match the input APK signer.\\n\\n'
            f'Input signer SHA-256: {original_signer_sha256}\\n'
            f'Output signer SHA-256: {final_signer_sha256}'
        )
'''
          if old not in text:
              raise SystemExit('expected v1.0.7 signer block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          version = Path('tools/apk-patcher/VERSION')
          version.write_text('1.0.8\n', encoding='utf-8')
          PY
          python -m py_compile tools/apk-patcher/apk-patcher.pyw
          git diff --check
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/apk-patcher/apk-patcher.pyw tools/apk-patcher/VERSION
          git commit -m 'fix(apk-patcher): allow verifier-approved v1-only APK output'
          git push origin HEAD:main

  build:
    needs: apply
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: Windows
            install: |
              python -m venv env
              .\env\Scripts\activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            build: |
              cd tools\apk-patcher
              ..\..\env\Scripts\pyinstaller apk-patcher_windows.spec
            source: tools/apk-patcher/dist/mltd-relive-apk-patcher.exe
            output: mltd-relive-apk-patcher-v1.0.8-windows.exe
            artifact: patcher-windows
          - os: ubuntu-latest
            target: Ubuntu
            install: |
              python -m venv env
              source env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            build: |
              cd tools/apk-patcher
              ../../env/bin/pyinstaller apk-patcher_ubuntu.spec
            source: tools/apk-patcher/dist/mltd-relive-apk-patcher
            output: mltd-relive-apk-patcher-v1.0.8-ubuntu
            artifact: patcher-ubuntu
          - os: macos-latest
            target: macOS
            install: |
              python -m venv env
              source env/bin/activate
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
            build: |
              cd tools/apk-patcher
              ../../env/bin/pyinstaller apk-patcher_macos.spec
              cd dist
              zip -r9 mltd-relive-apk-patcher-v1.0.8-macos.zip mltd-relive-apk-patcher.app
            source: tools/apk-patcher/dist/mltd-relive-apk-patcher-v1.0.8-macos.zip
            output: mltd-relive-apk-patcher-v1.0.8-macos.zip
            artifact: patcher-macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm v1.0.8 source
        shell: bash
        run: |
          grep -qx '1.0.8' tools/apk-patcher/VERSION
          grep -q 'final_signer_sha256 = None' tools/apk-patcher/apk-patcher.pyw
          python -m py_compile tools/apk-patcher/apk-patcher.pyw
      - name: Install dependencies for ${{ matrix.target }}
        run: ${{ matrix.install }}
      - name: Build for ${{ matrix.target }}
        run: ${{ matrix.build }}
      - name: Stage artifact
        shell: bash
        env:
          SOURCE: ${{ matrix.source }}
          OUTPUT: ${{ matrix.output }}
        run: |
          mkdir -p release-output
          cp "$SOURCE" "release-output/$OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-output/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Replace old patcher assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for name in $(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^mltd-relive-apk-patcher-v' || true); do
            gh release delete-asset "$RELEASE_TAG" "$name" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release upload "$RELEASE_TAG" artifacts/patcher-windows/* artifacts/patcher-ubuntu/* artifacts/patcher-macos/* --repo "$GITHUB_REPOSITORY" --clobber
