name: Remove superseded APK Patcher v1.0.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-patcher-v1.0.2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove v1.0.2 assets from standalone-v0.1.3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            mltd-relive-apk-patcher-v1.0.2-windows.exe \
            mltd-relive-apk-patcher-v1.0.2-ubuntu \
            mltd-relive-apk-patcher-v1.0.2-macos.zip
          do
            gh release delete-asset standalone-v0.1.3 "$asset" \
              --repo "${GITHUB_REPOSITORY}" --yes || true
          done
