name: Test live asset compatibility

on:
  push:
    branches:
      - fix/live-asset-compat
    paths:
      - 'key/assets.rainbowunicorn7297.com.crt'
      - 'key/assets.rainbowunicorn7297.com.key'
      - 'standalone/mltd/services/asset.py'
      - 'standalone/mltd/servers/dns.py'
      - 'standalone/mltd/servers/proxy.py'
      - 'tests/test_api_serial_compat.py'
      - 'tests/test_asset_host_routing.py'
      - 'tests/test_local_asset_runtime.py'
      - 'tests/test_proxy_tls_compat.py'
      - 'tests/test_strict_local_and_api.py'
      - '.github/workflows/test-live-asset-compat.yml'

jobs:
  asset-cert:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate asset certificate
        run: |
          cert=key/assets.rainbowunicorn7297.com.crt
          key=key/assets.rainbowunicorn7297.com.key
          openssl x509 -in "$cert" -noout -checkend 2592000
          openssl x509 -in "$cert" -noout -ext subjectAltName | grep -F 'DNS:assets.rainbowunicorn7297.com'
          cert_pub="$(openssl x509 -in "$cert" -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
          key_pub="$(openssl pkey -in "$key" -pubout -outform DER | sha256sum | cut -d' ' -f1)"
          test "$cert_pub" = "$key_pub"

  asset-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: >-
          python -m pip install
          requests==2.31.0 msgpack==1.0.5 json-rpc==1.15.0
          dnslib==0.9.23 netifaces==0.11.0
      - run: python -m unittest tests.test_asset_host_routing -v

  proxy-compat:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python -m unittest tests.test_proxy_tls_compat -v

  api-close:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python -m unittest tests.test_strict_local_and_api.DirectWSGIDispatchTest -v

  api-serial:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python -m unittest tests.test_api_serial_compat -v

  local-runtime:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python -m unittest tests.test_local_asset_runtime -v
