name: Test live asset compatibility

on:
  workflow_dispatch:

jobs:
  asset-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: >-
          python -m pip install
          requests==2.31.0 msgpack==1.0.5 json-rpc==1.15.0
          dnslib==0.9.23 netifaces==0.11.0
      - run: python -m unittest tests.test_asset_host_routing -v

  asset-cache:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python -m unittest tests.test_asset_cache_tool -v

  gui-remote-asset:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_gui_remote_asset_ui -v

  proxy-compat:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python -m unittest tests.test_proxy_tls_compat -v

  api-keepalive:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python -m unittest tests.test_strict_local_and_api.DirectWSGIDispatchTest -v

  api-concurrent:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests==2.31.0 msgpack==1.0.5
      - run: python -m unittest tests.test_api_serial_compat -v

  unit-sqlalchemy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install SQLAlchemy==2.0.19
      - run: python -m unittest tests.test_unit_sqlalchemy_compat -v
