name: Audit client mission mapping

on:
  push:
    branches:
      - fix/story-service-compat
    paths:
      - '.github/workflows/audit-client-mission-mapping.yml'

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git fetch origin client-decompiled-zh-fixed-v1 --depth=1
      - name: Inspect client mission call sites
        shell: bash
        run: |
          set -euo pipefail
          git show origin/client-decompiled-zh-fixed-v1:il2cpp-dump/dump.cs > /tmp/dump.cs
          for range in \
            525650,526020 \
            612930,613150 \
            705780,706030 \
            814760,814930 \
            828430,828550; do
            start=${range%,*}; end=${range#*,}
            echo "=== dump.cs ${start}-${end} ==="
            sed -n "${start},${end}p" /tmp/dump.cs
          done
          echo '=== NAMED UPDATE METHODS ==='
          grep -n -B 20 -A 40 -E '_UpdateMobileReadMission|_UpdateMVPlayMission|_UpdateCostumeChangeMission|ShowOpenURLPopup|CheckClientMission' /tmp/dump.cs | head -n 1200 || true
      - name: Summarize likely client-managed master missions
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from collections import defaultdict
          with open('standalone/mltd/models/mst_data/mst_mission.csv', newline='', encoding='utf-8-sig') as f:
              rows = list(csv.DictReader(f))
          for r in rows:
              if r['option'] in {'dress', 'mobile', 'thirteen'} or r['mst_mission_class_id'] in {'74', '75'}:
                  print(r['mst_mission_id'], r['mission_type'], r['mst_mission_class_id'], r['goal'], repr(r['option']), repr(r['option2']), r['jump_type'])
          print('=== CLASSES BY JUMP TYPE OF CLIENT CALLERS ===')
          by_jump = defaultdict(set)
          for r in rows:
              by_jump[r['jump_type']].add(int(r['mst_mission_class_id']))
          for jump in ('CostumeCheck', 'Home', 'SongSelect', 'IdolGift'):
              print(jump, sorted(by_jump[jump]))
          PY
